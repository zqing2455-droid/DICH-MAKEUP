<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luyện phản xạ · Thuật ngữ Makeup</title>
<!-- Ba chế độ luyện cho người đi dịch, dùng chung dữ liệu du-lieu.js với index.html:
       1. Phản xạ 3 giây — từ hiện lên, nói to nghĩa trước khi hết giờ; máy lặp lại ngắt quãng theo mức thuộc.
       2. Cặp bẫy        — hai lựa chọn, bấm thật nhanh, chỉ gồm các cặp hay dịch lẫn (danh sách BAY ở cuối file).
       3. Dịch đuổi      — nghe một câu, dịch thành tiếng trong vài giây, rồi mới xem bản dịch; có ghi âm để nghe lại.
     Mức thuộc từng từ lưu ở localStorage (khoá mk-px), chỉ trên máy đang dùng. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#D6F1EF; --mint-soft:#E8F8F7; --mint-deep:#2E8F86;
  --cream:#FDF9EF; --card:#fff;
  --ink:#141414; --muted:#6E6760; --hair:rgba(20,20,20,.14);
  --purple:#9A8AF0; --purple-deep:#5F4BC9; --purple-soft:#EFECFD;
  --butter:#FCE9A4; --butter-soft:#FDF3CE; --butter-line:#E3C76B;
  --coral:#EE8574; --coral-soft:#FDEDE9;
  --shadow:0 2px 0 rgba(20,20,20,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
.zh{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--mint);border-bottom:1.5px solid var(--ink);padding:calc(12px + env(safe-area-inset-top)) 14px 0}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.brand h1{font-family:"Playfair Display",Georgia,serif;font-size:25px;margin:0;font-weight:600;letter-spacing:-.015em;line-height:1.1}
.brand .sub{font-size:11.5px;color:#3A5F5C;margin-top:2px;letter-spacing:.02em}
.brand a.back{margin-left:auto;flex:0 0 auto;border:1.5px solid var(--ink);background:#fff;color:var(--ink);text-decoration:none;
  padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 11px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:7px 15px;border-radius:999px;font-size:13.5px;
  font-weight:500;cursor:pointer;white-space:nowrap;font-family:inherit;transition:.12s}
.tab[aria-selected="true"]{background:var(--purple);color:#fff;font-weight:700}
main{padding:16px 14px 60px;max-width:760px;margin:0 auto}
.hide{display:none !important}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 10px;padding:0 14px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:6px 13px;border-radius:999px;font-size:12.5px;
  font-weight:500;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip.on{background:var(--ink);color:#fff;font-weight:700}
.chip.warn.on{background:var(--butter);color:var(--ink)}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 6px}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:17px;padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.card p{margin:0 0 8px}
.card p:last-child{margin:0}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:9px;gap:10px;flex-wrap:wrap}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);background:var(--butter);border:1.5px solid var(--ink);
  border-radius:999px;padding:5px 13px;font-size:14px;min-width:58px;text-align:center}
.timer.het{background:var(--coral-soft)}
.prog{height:7px;background:#fff;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--purple);transition:width .25s}
.ring{height:6px;background:#fff;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;margin:0 0 12px}
.ring i{display:block;height:100%;background:var(--coral);transition:width .1s linear}
.drill{background:#fff;border:1.5px solid var(--ink);border-radius:20px;padding:20px 17px;margin-bottom:11px;min-height:190px;
  box-shadow:0 3px 0 rgba(20,20,20,.08);display:flex;flex-direction:column;justify-content:center}
.drill .src{font-size:30px;line-height:1.4;font-weight:500;text-align:center}
.drill .src.lat{font-size:21px}
.drill .src.cau{font-size:23px;text-align:left}
.drill .src.lat.cau{font-size:18.5px}
.drill .py{text-align:center;color:var(--purple-deep);font-weight:700;margin-top:4px;font-size:15px}
.drill .ans{margin-top:16px;background:var(--mint);border:1.5px solid var(--ink);border-radius:14px;padding:13px 15px}
.drill .ans .a{font-size:19px;font-weight:700;line-height:1.45}
.drill .ans .a.zh{font-size:22px}
.drill .ans .p{font-size:14px;color:var(--purple-deep);font-weight:700;margin-top:2px}
.drill .ans .nn{font-size:12.5px;color:#275B56;margin-top:8px;line-height:1.5}
.drill .ans .nn b{color:#9A3A1F}
.drill .tapme{margin-top:14px;font-size:12.5px;color:var(--muted);font-style:italic;text-align:center}
.drill .an{filter:blur(9px);user-select:none}
.fbtns{display:flex;gap:9px;flex-wrap:wrap}
.fbtns button{flex:1 1 90px;padding:13px 8px;border-radius:999px;border:1.5px solid var(--ink);font-size:14.5px;font-weight:700;cursor:pointer;
  background:#fff;color:var(--ink);font-family:inherit}
.fbtns .no{background:var(--coral-soft)}
.fbtns .mid{background:var(--butter)}
.fbtns .yes{background:var(--mint)}
.fbtns button:disabled{opacity:.45;cursor:default}
.nextb{width:100%;margin-top:12px;padding:14px;border-radius:999px;border:1.5px solid var(--ink);background:var(--purple);color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.nextb.ghost{background:#fff;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .nextb{width:auto;flex:1 1 140px;margin-top:0;padding:11px 14px;font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{padding:16px 10px;border-radius:15px;border:1.5px solid var(--ink);background:#fff;font-size:17px;font-weight:600;cursor:pointer;color:var(--ink);
  font-family:inherit;line-height:1.35;box-shadow:var(--shadow);text-align:center}
.opt.zh{font-size:22px}
.opt.right{background:var(--mint)}
.opt.wrong{background:var(--coral-soft);color:#A33A28}
.opt:disabled{cursor:default}
.score{text-align:center;padding:26px 18px;background:var(--mint);border:1.5px solid var(--ink);border-radius:22px;margin-bottom:12px}
.score .big{font-family:"Playfair Display",Georgia,serif;font-size:50px;font-weight:700;line-height:1.1}
.score .msg{font-size:14.5px;margin-top:6px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat div{background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:9px 6px;text-align:center}
.stat b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:24px;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.list li{background:#fff;border:1.5px solid var(--ink);border-radius:13px;padding:9px 12px;font-size:14px}
.list li.bad{background:var(--coral-soft)}
.list li .zh{font-size:17px;font-weight:600}
.list li small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45}
.rec{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.rec button{padding:9px 14px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
.rec button.dang{background:var(--coral);color:#fff;animation:nhay 1s infinite}
.rec audio{height:36px;flex:1 1 180px;min-width:160px}
.rec .nhac{font-size:12px;color:var(--muted);flex-basis:100%}
@keyframes nhay{50%{opacity:.55}}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.toggle input{width:17px;height:17px;accent-color:var(--purple-deep)}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:26px 14px 8px;line-height:1.7;border-top:1.5px solid var(--ink);margin-top:26px}
.foot b{font-family:"Playfair Display",Georgia,serif;font-weight:600;color:var(--ink)}
@media(max-width:420px){.drill .src{font-size:26px}.opt{font-size:15.5px}.opt.zh{font-size:20px}}
@media(prefers-reduced-motion:reduce){.rec button.dang{animation:none}.ring i,.prog i{transition:none}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div>
      <h1>Luyện phản xạ</h1>
      <div class="sub">NGHE LÀ BẬT RA · nói thành tiếng, có đồng hồ</div>
    </div>
    <a class="back" href="index.html">← Tra cứu</a>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-v="px">⚡ Phản xạ 3 giây</button>
    <button class="tab" role="tab" aria-selected="false" data-v="bay">⚠ Cặp bẫy</button>
    <button class="tab" role="tab" aria-selected="false" data-v="duoi">🎧 Dịch đuổi</button>
  </div>
</header>

<main>
<section id="px"></section>
<section id="bay" class="hide"></section>
<section id="duoi" class="hide"></section>
</main>

<div class="foot">Mức thuộc từng từ chỉ lưu trên máy này. Giọng đọc là giọng máy, để lấy nhịp chứ không phải chuẩn phát âm.<br><b>Thuật ngữ Makeup Trung–Việt</b></div>

<script src="du-lieu.js"></script>
<script>
"use strict";
(function(){
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const store=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}};
const zh1=s=>String(s).split("/")[0].trim();           // 散粉 / 定妆粉 → 散粉
const NGAY=86400000;
const T=D.terms, TOP=new Set(D.top20.map(x=>x.zh));
const laTop=t=>TOP.has(zh1(t.zh))||TOP.has(t.zh);

/* ---------- đọc tiếng Trung ---------- */
let zhVoice=null;
function pickVoice(){const vs=window.speechSynthesis?speechSynthesis.getVoices():[];const zh=vs.filter(v=>/^zh/i.test(v.lang));
 zhVoice=zh.find(v=>/CN|Hans|Chinese \(China\)|普通话|Mandarin/i.test(v.lang+v.name))||zh[0]||null;}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let dangDoc=null;
function speak(text,rate,onend){
 if(!text)return;
 text=String(text).replace(/\s*\/\s*/g,"，").replace(/（[^）]*）/g,"");
 if(window.speechSynthesis&&zhVoice){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.voice=zhVoice;u.lang=zhVoice.lang;u.rate=rate||0.9;
  if(onend)u.onend=onend;dangDoc=u;speechSynthesis.speak(u);return;
 }
 try{const a=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q="+encodeURIComponent(text));
  if(onend)a.onended=onend;a.play().catch(()=>{if(onend)onend();});}catch(e){if(onend)onend();}
}
function stopSpeak(){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}}
let AC=null;
function sfx(ok){
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
  (ok?[660,880]:[220]).forEach((f,k)=>{const o=AC.createOscillator(),v=AC.createGain();o.type=ok?"sine":"triangle";o.frequency.value=f;
   v.gain.setValueAtTime(.0001,t+k*.1);v.gain.exponentialRampToValueAtTime(.07,t+k*.1+.02);v.gain.exponentialRampToValueAtTime(.0001,t+k*.1+.2);
   o.connect(v);v.connect(AC.destination);o.start(t+k*.1);o.stop(t+k*.1+.22);});}catch(e){}
}

/* ---------- đồng hồ đếm ngược ---------- */
let TM=null;
function demNguoc(giay,ring,txt,onHet){
 stopDem();
 const t0=performance.now();
 const tick=()=>{const con=Math.max(0,giay-(performance.now()-t0)/1000);
  if(ring)ring.style.width=(con/giay*100)+"%";
  if(txt)txt.textContent=con.toFixed(1)+"s";
  if(con<=0){TM=null;if(txt)txt.classList.add("het");onHet();return;}
  TM=requestAnimationFrame(tick);};
 TM=requestAnimationFrame(tick);
}
function stopDem(){if(TM){cancelAnimationFrame(TM);TM=null;}}

/* ---------- tab ---------- */
const views=["px","bay","duoi"];
const ve={px:vePX,bay:veBay,duoi:veDuoi};
document.querySelectorAll(".tab[data-v]").forEach(b=>b.onclick=()=>moTab(b.dataset.v));
function moTab(v){
 stopDem();stopSpeak();
 document.querySelectorAll(".tab[data-v]").forEach(x=>x.setAttribute("aria-selected",x.dataset.v===v));
 views.forEach(k=>$("#"+k).classList.toggle("hide",k!==v));
 window.scrollTo(0,0);try{history.replaceState(null,"","#"+v);}catch(e){}
 ve[v]();
}

/* =====================================================================
   1. PHẢN XẠ 3 GIÂY
   Mức thuộc (hộp) từng từ: 0 chưa học · 1 đang học · 2 gần thuộc · 3 thuộc.
   Bật ra ngay → lên hộp, hẹn gặp lại sau 1 / 3 / 7 ngày. Chậm → giữ hộp, gặp lại sau 10 từ. Trật → về hộp 1, gặp lại sau 3 từ.
   ===================================================================== */
const KPX="mk-px";
let PX=store(KPX)||{};                 // { "散粉": {b:hộp, d:hẹn (ms)} }
const key=t=>zh1(t.zh);
const muc=t=>(PX[key(t)]||{}).b||0;
const den=t=>(PX[key(t)]||{}).d||0;
const CAT_CHIPS=["Tất cả","20 từ bẫy","Từ bẫy (76)","Chưa thuộc","Đến hạn hôm nay"].concat(D.cats);
let pxCat=store("mk-px-cat")||"20 từ bẫy", pxDir=store("mk-px-dir")||"zh", pxGiay=store("mk-px-giay")||3, pxTuDoc=store("mk-px-doc")!==0;
let pxQ=[],pxI=0,pxItem=null,pxDa=0,pxOk=0,pxVap=[],pxLo=false;
function pxLoc(){
 let a=T.slice();
 if(pxCat==="20 từ bẫy")a=a.filter(laTop);
 else if(pxCat==="Từ bẫy (76)")a=a.filter(t=>t.w);
 else if(pxCat==="Chưa thuộc")a=a.filter(t=>muc(t)<2);
 else if(pxCat==="Đến hạn hôm nay")a=a.filter(t=>muc(t)>0&&den(t)<=Date.now());
 else if(pxCat!=="Tất cả")a=a.filter(t=>t.c===pxCat);
 return a;
}
function pxThongKe(a){const s=[0,0,0,0];a.forEach(t=>s[muc(t)]++);return s;}
function vePX(){
 const sec=$("#px");sec.innerHTML="";
 const s=pxThongKe(pxLoc());
 sec.appendChild(el("div","lbl","Luyện bộ từ nào"));
 const ch=el("div","chips");
 CAT_CHIPS.forEach(c=>{const b=el("button","chip"+(c===pxCat?" on":"")+(/bẫy/.test(c)?" warn":""),esc(c));b.onclick=()=>{pxCat=c;store("mk-px-cat",c);vePX();};ch.appendChild(b);});
 sec.appendChild(ch);
 const r=el("div","chips");
 [["zh","中文 → nói tiếng Việt"],["vi","Việt → nói 中文"]].forEach(([k,n])=>{const b=el("button","chip"+(k===pxDir?" on":""),n);b.onclick=()=>{pxDir=k;store("mk-px-dir",k);vePX();};r.appendChild(b);});
 [3,5,8].forEach(g=>{const b=el("button","chip"+(g===pxGiay?" on":""),g+" giây");b.onclick=()=>{pxGiay=g;store("mk-px-giay",g);vePX();};r.appendChild(b);});
 sec.appendChild(r);
 sec.appendChild(el("div","stat",'<div><b>'+(s[3])+'</b><span>thuộc</span></div><div><b>'+(s[1]+s[2])+'</b><span>đang học</span></div><div><b>'+s[0]+'</b><span>chưa học</span></div>'));
 const c=el("div","card",'<p><b>Cách luyện:</b> từ hiện lên, em nói to '+(pxDir==="zh"?"nghĩa tiếng Việt":"tiếng Trung")+' trước khi hết '+pxGiay+' giây. Hết giờ máy lật đáp án, em tự chấm thật lòng: '+
  '<b>Bật ra ngay</b> (lên mức), <b>Chậm</b> (gặp lại sau 10 từ), <b>Trật</b> (gặp lại sau 3 từ). Từ đã thuộc sẽ quay lại sau 1, 3, rồi 7 ngày.</p>'+
  '<p style="font-size:13px;color:var(--muted)">Mỗi lượt 20 từ, ưu tiên từ đến hạn và từ chưa học. Bộ đang chọn: '+pxLoc().length+' từ.</p>');
 sec.appendChild(c);
 const lab=el("label","toggle");lab.innerHTML='<input type="checkbox" '+(pxTuDoc?"checked":"")+'> Tự đọc tiếng Trung khi hiện từ';
 lab.querySelector("input").onchange=e=>{pxTuDoc=e.target.checked;store("mk-px-doc",pxTuDoc?1:0);};
 c.appendChild(lab);
 const b=el("button","nextb","Bắt đầu lượt 20 từ");b.onclick=pxBatDau;sec.appendChild(b);
 if(Object.keys(PX).length){const x=el("button","nextb ghost","Xoá mức thuộc đã lưu (làm lại từ đầu)");x.onclick=()=>{if(confirm("Xoá toàn bộ mức thuộc đã lưu trên máy này?")){PX={};store(KPX,PX);vePX();}};sec.appendChild(x);}
}
function pxBatDau(){
 const a=pxLoc();if(!a.length){alert("Bộ này chưa có từ nào.");return;}
 const now=Date.now();
 // thứ tự ưu tiên: đến hạn (hộp thấp trước) → chưa học → còn lại (hộp thấp trước); trong cùng nhóm thì ngẫu nhiên
 const uu=t=>muc(t)>0&&den(t)<=now?0+muc(t)/10:muc(t)===0?1:2+muc(t)/10;
 pxQ=shuffle(a).sort((x,y)=>uu(x)-uu(y)).slice(0,20);
 pxI=0;pxDa=0;pxOk=0;pxVap=[];pxItem=null;
 pxTiep();
}
function pxTiep(){
 if(!pxQ.length){pxXong();return;}
 pxItem=pxQ.shift();pxLo=false;
 const t=pxItem,sec=$("#px");sec.innerHTML="";
 sec.appendChild(el("div","meta",'<span>Từ '+(pxDa+1)+' · còn '+pxQ.length+' trong lượt</span><span>mức '+muc(t)+'/3 · '+esc(t.c)+'</span><span class="timer" id="pxT"></span>'));
 sec.appendChild(el("div","ring",'<i id="pxR" style="width:100%"></i>'));
 const d=el("div","drill");
 if(pxDir==="zh"){d.innerHTML='<div class="src zh">'+esc(t.zh)+'</div><div class="py an" id="pxPy">'+esc(t.py)+'</div>';}
 else d.innerHTML='<div class="src lat">'+esc(t.vi)+'</div>';
 d.appendChild(el("div","tapme",pxDir==="zh"?"Nói to nghĩa tiếng Việt…":"Nói to tiếng Trung…"));
 d.onclick=()=>pxLat();
 sec.appendChild(d);
 const fb=el("div","fbtns");
 [["no","Trật"],["mid","Chậm"],["yes","Bật ra ngay"]].forEach(([c,n])=>{const b=el("button",c,n);b.disabled=true;b.onclick=()=>pxCham(c);fb.appendChild(b);});
 sec.appendChild(fb);

  rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());
   if(!recChunks.length||!box.isConnected)return;
   if(recUrl)URL.revokeObjectURL(recUrl);
   recUrl=URL.createObjectURL(new Blob(recChunks,{type:rec.mimeType||"audio/webm"}));
   box.innerHTML='<span style="font-size:13px;font-weight:700">Giọng em:</span>';const au=el("audio");au.controls=true;au.src=recUrl;box.appendChild(au);
   box.appendChild(el("span","nhac","Nghe lại xem có “ừm”, có ngập ngừng, có bịa từ không."));};
  rec.start();
  const b=el("button","dang","● Đang ghi… bấm để dừng");b.onclick=duDungGhi;box.innerHTML="";box.appendChild(b);
 }catch(e){box.innerHTML='<span class="nhac">Chưa được phép dùng micro. Em cho phép trong thanh địa chỉ rồi thử lại, hoặc tắt ghi âm ở phần cài đặt.</span>';}
}
function duDungGhi(){try{if(rec&&rec.state!=="inactive")rec.stop();}catch(e){}rec=null;}

/* ---------- mở ---------- */
let dau=(location.hash||"").replace("#","");
moTab(views.indexOf(dau)>=0?dau:"px");
})();
</script>
