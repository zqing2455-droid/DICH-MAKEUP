<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thuật ngữ Makeup Trung–Việt</title>
<style>
:root{
  --bg:#FBF8F6; --card:#fff; --ink:#2A211E; --muted:#7D6E67; --line:#EBE1DB;
  --accent:#AE4F49; --accent-soft:#FAEDEB; --warn:#B4530C; --warn-bg:#FDF4E9;
  --good:#3C7558; --good-bg:#ECF4EF; --shadow:0 1px 2px rgba(42,33,30,.05),0 4px 14px rgba(42,33,30,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:16px; line-height:1.5; padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
.zh{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif}
header{
  position:sticky; top:0; z-index:20; background:rgba(251,248,246,.94);
  backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 0;
}
.brand{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 9px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
  padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  font-family:inherit;transition:.12s;
}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:14px 14px 56px;max-width:720px;margin:0 auto}
.search{position:relative;margin-bottom:12px}
.search input{
  width:100%;padding:13px 40px 13px 15px;font-size:16px;font-family:inherit;color:var(--ink);
  border:1px solid var(--line);border-radius:13px;background:var(--card);box-shadow:var(--shadow);outline:none;
}
.search input:focus{border-color:var(--accent)}
.clearx{
  position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:#EFE7E2;color:var(--muted);
  width:26px;height:26px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer;display:none;font-family:inherit;
}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 12px;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
  padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;
}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.warn.on{background:var(--warn);border-color:var(--warn)}
.count{font-size:12.5px;color:var(--muted);margin:0 2px 9px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;
  margin-bottom:8px;box-shadow:var(--shadow);
}
.card.w{border-left:3px solid var(--warn);background:var(--warn-bg)}
.row1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.t-zh{font-size:21px;font-weight:600;letter-spacing:.01em}
.t-py{font-size:12.5px;color:var(--muted);font-style:italic}
.t-vi{font-size:16.5px;font-weight:650;color:var(--accent);margin-top:5px}
.t-note{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}
.card.w .t-note{color:#8A4A17}
.t-cat{font-size:11px;color:var(--muted);background:#F3EDE9;padding:2px 7px;border-radius:5px;display:inline-block;margin-top:7px}
.card.w .t-cat{background:#F6E4D2;color:#8A4A17}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14.5px}
.sect{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:18px 2px 8px}
.sect:first-child{margin-top:2px}
/* flashcards */
.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.panel h3{margin:0 0 9px;font-size:13.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{
  border:1px solid var(--line);background:var(--bg);color:var(--muted);padding:7px 12px;border-radius:9px;
  font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.flash{
  background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);
  min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px 20px;text-align:center;cursor:pointer;margin-bottom:11px;position:relative;
}
.flash .front{font-size:40px;font-weight:600;line-height:1.25}
.flash .front.small{font-size:25px}
.flash .back{margin-top:16px;padding-top:15px;border-top:1px solid var(--line);width:100%}
.flash .back .v{font-size:21px;font-weight:650;color:var(--accent)}
.flash .back .n{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.45}
.flash .hint{position:absolute;bottom:11px;font-size:11.5px;color:#BCAEA7}
.fbtns{display:flex;gap:8px}
.fbtns button{
  flex:1;padding:13px;border-radius:11px;border:1px solid var(--line);font-size:14.5px;font-weight:650;
  cursor:pointer;background:var(--card);color:var(--ink);font-family:inherit;
}
.fbtns .no{color:var(--warn);border-color:#EDD6BE;background:var(--warn-bg)}
.fbtns .yes{color:var(--good);border-color:#CFE2D7;background:var(--good-bg)}
.prog{height:5px;background:#EFE7E2;border-radius:99px;overflow:hidden;margin-bottom:11px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:8px}
/* quiz */
.q{font-size:34px;font-weight:600;text-align:center;padding:22px 10px 6px}
.q.small{font-size:22px}
.qsub{text-align:center;font-size:12.5px;color:var(--muted);font-style:italic;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  text-align:left;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-size:15.5px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);font-family:inherit;line-height:1.4;
}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:650}
.opt.wrong{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.opt:disabled{cursor:default;opacity:.75}
.opt.right:disabled,.opt.wrong:disabled{opacity:1}
.exp{margin-top:12px;padding:12px 13px;border-radius:11px;background:var(--accent-soft);font-size:13.5px;line-height:1.5;border-left:3px solid var(--accent)}
.nextb{
  width:100%;margin-top:11px;padding:14px;border-radius:11px;border:0;background:var(--ink);color:#fff;
  font-size:15px;font-weight:650;cursor:pointer;font-family:inherit;
}
.score{text-align:center;padding:30px 10px}
.score .big{font-size:46px;font-weight:700;color:var(--accent)}
/* phrases */
.p-card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
.p-zh{font-size:17px;line-height:1.45}
.p-vi{font-size:15.5px;font-weight:650;color:var(--accent);margin-top:6px;line-height:1.45}
.p-note{font-size:12.5px;color:var(--muted);margin-top:6px}
.p-rev .p-vi{color:var(--ink);font-weight:500;font-size:15.5px}
.p-rev .p-zh{color:var(--accent);font-weight:600}
mark{background:#FAE3A8;color:inherit;padding:0 1px;border-radius:2px}
.hide{display:none!important}
.foot{text-align:center;font-size:11.5px;color:#BCAEA7;padding:22px 10px 6px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Thuật ngữ Makeup</h1><span>Trung – Việt · 中越美妆</span></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-v="look">Tra cứu</button>
    <button class="tab" role="tab" aria-selected="false" data-v="flash">Thẻ nhớ</button>
    <button class="tab" role="tab" aria-selected="false" data-v="quiz">Kiểm tra</button>
    <button class="tab" role="tab" aria-selected="false" data-v="phr">Mẫu câu</button>
    <button class="tab" role="tab" aria-selected="false" data-v="top">20 từ bẫy</button>
  </div>
</header>
<main>
  <section id="look">
    <div class="search">
      <input id="q" type="search" placeholder="Gõ tiếng Trung, pinyin hoặc tiếng Việt…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="clearx" id="cx" aria-label="Xoá">×</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
    <div id="res"></div>
  </section>

  <section id="flash" class="hide">
    <div class="panel">
      <h3>Chiều hỏi</h3>
      <div class="seg" id="dir">
        <button class="on" data-d="zh">中文 → Việt</button>
        <button data-d="vi">Việt → 中文</button>
      </div>
    </div>
    <div class="panel">
      <h3>Nhóm từ</h3>
      <div class="seg" id="fcat"></div>
    </div>
    <div class="meta"><span id="fmeta"></span><button id="freset" style="border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;padding:0">Học lại từ đầu</button></div>
    <div class="prog"><i id="fprog" style="width:0%"></i></div>
    <div class="flash" id="fcard"></div>
    <div class="fbtns">
      <button class="no" id="fno">Chưa thuộc</button>
      <button class="yes" id="fyes">Thuộc rồi</button>
    </div>
  </section>

  <section id="quiz" class="hide">
    <div class="panel">
      <h3>Luyện phần nào</h3>
      <div class="seg" id="qmode">
        <button class="on" data-m="all">Tất cả</button>
        <button data-m="warn">Chỉ từ bẫy ⚠</button>
      </div>
    </div>
    <div id="qbody"></div>
  </section>

  <section id="phr" class="hide">
    <div class="search">
      <input id="pq" type="search" placeholder="Tìm mẫu câu…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="clearx" id="pcx" aria-label="Xoá">×</button>
    </div>
    <div class="chips" id="pchips"></div>
    <div id="pres"></div>
  </section>

  <section id="top" class="hide">
    <div class="count">20 từ vừa xuất hiện nhiều nhất, vừa dễ dịch sai nhất. Thuộc nhóm này trước.</div>
    <div id="topres"></div>
  </section>

  <div class="foot">Soạn cho buổi dịch lớp trang điểm · tháng 12<br>Nghe không rõ thì hỏi lại — đừng bịa.</div>
</main>

te":"","w":0,"c":"Phong cách","cz":"风格"},{"i":229,"zh":"模特","py":"mótè","vi":"người mẫu / mẫu (để thực hành)","note":"Trong lớp: “bạn mẫu”.","w":0,"c":"Phong cách","cz":"风格"},{"i":230,"zh":"客户 / 顾客","py":"kèhù","vi":"khách / khách hàng","note":"","w":0,"c":"Phong cách","cz":"风格"}],"top20":[{"zh":"服帖","vi":"bám da / ăn da","why":"Cả buổi dạy nền đều quay quanh từ này."},{"zh":"晕染","vi":"tán / blend","why":"Động từ xuất hiện nhiều nhất trong lớp."},{"zh":"面中","vi":"vùng giữa mặt","why":"Nghe quen tai ngay, nhưng dịch sai là học viên chỉ sai chỗ."},{"zh":"卡粉","vi":"đọng phấn vào nếp / rãnh","why":"Không có từ một tiếng — phải dịch bằng cả cụm."},{"zh":"浮粉","vi":"nền nổi lên, không ăn da","why":"Hay bị lẫn với 卡粉."},{"zh":"斑驳","vi":"nền loang lổ, không đều","why":"Chủ đề riêng của một buổi học."},{"zh":"少量多次","vi":"lấy ít, làm nhiều lần","why":"Câu cửa miệng."},{"zh":"带一下","vi":"quét qua nhẹ một đường","why":"Dịch chữ là sai hoàn toàn."},{"zh":"虚一点","vi":"làm mờ viền đi","why":"“虚” = mờ, không phải “rỗng”."},{"zh":"匀一匀","vi":"gõ bớt phấn trên cọ","why":"Khẩu ngữ, từ điển không có."},{"zh":"山根","vi":"gốc mũi (giữa hai mắt)","why":"Không phải cả sống mũi."},{"zh":"法令纹","vi":"rãnh cười","why":"Đừng nói “nếp nhăn pháp lệnh”."},{"zh":"内双","vi":"mí lót","why":"Tiếng Việt có từ riêng rất đúng."},{"zh":"提亮","vi":"làm sáng vùng…","why":"Khác 高光 (highlight)."},{"zh":"骨相","vi":"cấu trúc xương","why":"Từ khoá của lớp chuyên nghiệp."},{"zh":"气垫","vi":"cushion","why":"Giữ nguyên tiếng Anh."},{"zh":"隔离霜","vi":"kem lót bảo vệ / chống nắng","why":"Tiếng Việt không có khái niệm tương ứng."},{"zh":"晕妆","vi":"makeup bị nhoè","why":"Nghe gần giống 晕染 nhưng nghĩa trái ngược."},{"zh":"妆造","vi":"makeup & tạo kiểu tổng thể","why":"Rộng hơn “makeup”."},{"zh":"氛围感","vi":"có vibe / có thần thái","why":"Không dịch được bằng từ Hán-Việt."}],"phrases":[{"g":"Trước giờ học — chốt với cô","zh":"老师，我们先对一下今天的流程好吗？","vi":"Xin cô cho em rà lại quy trình buổi hôm nay một lượt.","note":"Làm trước giờ học 20–30 phút."},{"g":"Trước giờ học — chốt với cô","zh":"老师，今天会用到哪些产品？能给我看一下包装吗？","vi":"Hôm nay cô dùng những sản phẩm nào ạ? Cho em xem vỏ hộp với.","note":"Chụp ảnh vỏ hộp — tên thương hiệu khó nghe nhất."},{"g":"Trước giờ học — chốt với cô","zh":"示范的时候，请您每一两句停一下，我好翻。","vi":"(Thoả thuận với cô) Khi làm mẫu, cô nói một hai câu rồi dừng cho em dịch.","note":"Điều quan trọng nhất phải chốt trước."},{"g":"Trước giờ học — chốt với cô","zh":"我举手就是请您停一下。","vi":"Em giơ tay nghĩa là xin cô dừng một chút.","note":"Chốt một ám hiệu tay."},{"g":"Trước giờ học — chốt với cô","zh":"品牌名、数字、价格，请您说慢一点或写下来。","vi":"Tên thương hiệu, con số, giá — xin cô nói chậm hoặc viết ra.","note":"Đây là chỗ dịch sai nguy hiểm nhất."},{"g":"Trước giờ học — chốt với cô","zh":"如果我翻错了，请直接用中文告诉我。","vi":"Nếu em dịch sai, cô cứ nói thẳng bằng tiếng Trung cho em.","note":"Thà sửa tại chỗ còn hơn sai cả buổi."},{"g":"Trước giờ học — chốt với cô","zh":"理论部分我可以整段翻，示范部分我紧跟着翻。","vi":"Phần lý thuyết em dịch theo đoạn, phần làm mẫu em dịch bám sát từng câu.","note":"Hai chế độ khác nhau — nói rõ để cô biết nhịp."},{"g":"Trước giờ học — chốt với cô","zh":"学员都是行业内的，很多英文词他们懂。","vi":"Học viên đều đang làm nghề, nhiều từ tiếng Anh họ hiểu hết.","note":"Để cô yên tâm khi bạn giữ nguyên tiếng Anh."},{"g":"Mở đầu & tổ chức lớp","zh":"大家好，我是今天的翻译。","vi":"Chào cả lớp, em là phiên dịch của buổi học hôm nay ạ.","note":""},{"g":"Mở đầu & tổ chức lớp","zh":"今天我们学习……","vi":"Hôm nay chúng ta sẽ học…","note":""},{"g":"Mở đầu & tổ chức lớp","zh":"我先示范一遍，大家先看，不要动手。","vi":"Cô làm mẫu một lượt trước. Mọi người xem đã, chưa làm theo vội nhé.","note":""},{"g":"Mở đầu & tổ chức lớp","zh":"现在请大家把工具准备好。","vi":"Bây giờ mọi người chuẩn bị dụng cụ ra nhé.","note":""},{"g":"Mở đầu & tổ chức lớp","zh":"两人一组，互相化。","vi":"Chia hai người một nhóm, làm cho nhau nhé.","note":""},{"g":"Mở đầu & tổ chức lớp","zh":"大家能看清吗？往前坐一点。","vi":"Mọi người nhìn rõ không ạ? Ngồi lên phía trên một chút nhé.","note":""},{"g":"Mở đầu & tổ chức lớp","zh":"有问题随时举手。","vi" 下，让他们先做完好吗？","vi":"","note":""},{"g":"Cứu nguy — nói với cô (中文)","zh":"老师，有学员问……","vi":"","note":"Mở đầu khi chuyển câu hỏi của học viên."},{"g":"Cứu nguy — nói với học viên","zh":"","vi":"Mọi người chờ em dịch xong rồi hãy làm nhé.","note":""},{"g":"Cứu nguy — nói với học viên","zh":"","vi":"Em xin phép xác nhận lại với cô một chút ạ.","note":"Nói rồi quay sang hỏi cô — lớp sẽ chờ."},{"g":"Cứu nguy — nói với học viên","zh":"","vi":"Từ này trong nghề mình hay gọi là gì ạ? Mọi người giúp em với.","note":"Vũ khí mạnh nhất: học viên biết tiếng Việt nghề hơn bạn."},{"g":"Cứu nguy — nói với học viên","zh":"","vi":"Em dịch lại cho rõ hơn ạ.","note":"Dùng khi bạn vừa dịch vụng."},{"g":"Cứu nguy — nói với học viên","zh":"","vi":"Ý cô là … — em diễn giải lại cho dễ hiểu ạ.","note":"Khi phải giải thích thay vì dịch sát."},{"g":"Cứu nguy — nói với học viên","zh":"","vi":"Bạn nói chậm giúp em để em dịch cho cô ạ.","note":""}],"cats":["Lớp nền","Tạo khối · Highlight","Mắt","Chân mày","Môi","Dụng cụ","Vùng mặt","Loại da","Hiệu ứng & lỗi","Động từ kỹ thuật","Màu sắc","Phong cách"]};
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.innerHTML = h; return e; };
const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase();
const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
D.terms.forEach(t => { t._s = norm(t.zh + ' ' + t.py + ' ' + t.vi + ' ' + t.note); });
D.phrases.forEach(p => { p._s = norm(p.zh + ' ' + p.vi + ' ' + p.note); });

function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

/* ---------- tabs ---------- */
const views = ['look', 'flash', 'quiz', 'phr', 'top'];
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b));
  views.forEach(v => $('#' + v).classList.toggle('hide', v !== b.dataset.v));
  window.scrollTo(0, 0);
  if (b.dataset.v === 'flash') drawFlash();
  if (b.dataset.v === 'quiz') nextQ();
  try { location.hash = b.dataset.v; } catch (e) {}
});

/* ---------- lookup ---------- */
let cat = 'Tất cả', onlyW = false;
const chips = $('#chips');
['Tất cả'].concat(D.cats).forEach(c => {
  const b = el('button', 'chip' + (c === 'Tất cả' ? ' on' : ''), esc(c));
  b.onclick = () => { cat = c; [...chips.children].forEach(x => x.classList.toggle('on', x === b || (x.classList.contains('warn') && onlyW))); draw(); };
  chips.appendChild(b);
});
const wb = el('button', 'chip warn', '⚠ Chỉ từ bẫy');
wb.onclick = () => { onlyW = !onlyW; wb.classList.toggle('on', onlyW); draw(); };
chips.appendChild(wb);

function hl(txt, q) {
  if (!q) return esc(txt);
  const n = norm(txt), nq = norm(q), i = n.indexOf(nq);
  if (i < 0) return esc(txt);
  return esc(txt.slice(0, i)) + '<mark>' + esc(txt.slice(i, i + q.length)) + '</mark>' + esc(txt.slice(i + q.length));
}
function termCard(t, q) {
  const c = el('div', 'card' + (t.w ? ' w' : ''));
  const r = el('div', 'row1');
  r.appendChild(el('div', 't-zh zh', hl(t.zh, q)));
  if (t.py) r.appendChild(el('div', 't-py', esc(t.py)));
  c.appendChild(r);
  c.appendChild(el('div', 't-vi', hl(t.vi, q)));
  if (t.note) c.appendChild(el('div', 't-note', (t.w ? '⚠ ' : '') + hl(t.note, q)));
  c.appendChild(el('span', 't-cat', esc(t.c) + ' · ' + esc(t.cz)));
  return c;
}
function draw() {
  const q = $('#q').value.trim(), nq = norm(q);
  $('#cx').style.display = q ? 'block' : 'none';
  let list = D.terms.filter(t => (cat === 'Tất cả' || t.c === cat) && (!onlyW || t.w) && (!nq || t._s.includes(nq)));
  $('#count').textContent = list.length + ' từ';
  const box = $('#res'); box.innerHTML = '';
  if (!list.length) { box.appendChild(el('div', 'empty', 'Không tìm thấy từ này.<br>Thử gõ bằng tiếng Trung, pinyin không dấu, hoặc tiếng Việt.')); return; }
  const f = document.createDocumentFragment();
  list.slice(0, 400).forEach(t => f.appendChild(termCard(t, q)));
  box.appendChild(f);
}
$('#q').oninput = draw;
$('#cx').onclick = () => { $('#q').value = ''; draw(); $('#q').focus(); };
draw();

/* ---------- flashcards ---------- */
let fdir = 'zh', fcat = 'Tất cả', fdeck = [], fi = 0, fshow = false;
const fcatBox = $('#fcat');
['Tất cả', '⚠ Từ bẫy'].concat(D.cats).forEach(c => {
  const b = el('button', c === 'Tất cả' ? 'on' : '', esc(c));
  b.onclick = () => { fcat = c; [...fcatBox.children].forEach(x => x.classList.toggle('on', x === b)); buildDeck(); };
  fcatBox.appendChild(b);
});
$('#dir').querySelectorAll('button').forEach(b => b.onclick = () => {
  fdir = b.dataset.d; $('#dir').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); drawFlash();
});
function known() { return store('mk_known') || {}; }
function buildDeck() {
  const k = known();
  let pool = D.terms.filter(t => fcat === 'Tất cả' || (fcat === '⚠ Từ bẫy' ? t.w : t.c === fcat));
  const left = pool.filter(t => !k[t.i]);
  fdeck = (left.length ? left : pool).slice().sort(() => Math.random() - .5);
  fi = 0; fshow = false; drawFlash();
}
function drawFlash() {
  if (!fdeck.length) buildDeck();
  const k = known();
  const pool = D.terms.filter(t => fcat === 'Tất cả' || (fcat === '⚠ Từ bẫy' ? t.w : t.c === fcat));
  const done = pool.filter(t => k[t.i]).length;
  $('#fmeta').textContent = 'Thuộc ' + done + '/' + pool.length + ' · còn ' + Math.max(0, fdeck.length - fi) + ' thẻ';
  $('#fprog').style.width = (pool.length ? done / pool.length * 100 : 0) + '%';
  const c = $('#fcard'); c.innerHTML = '';
  if (fi >= fdeck.length) {
    c.appendChild(el('div', 'front small', '🎉 Xong vòng này'));
    c.appendChild(el('div', 'hint', 'Bấm để bắt đầu vòng mới'));
    c.onclick = buildDeck; return;
  }
  const t = fdeck[fi];
  const frontTxt = fdir === 'zh' ? t.zh : t.vi;
  c.appendChild(el('div', 'front' + (frontTxt.length > 8 ? ' small' : '') + (fdir === 'zh' ? ' zh' : ''), esc(frontTxt)));
  if (fshow) {
    const b = el('div', 'back');
    b.appendChild(el('div', 'v' + (fdir === 'vi' ? ' zh' : ''), esc(fdir === 'zh' ? t.vi : t.zh) + (fdir === 'vi' && t.py ? ' <span style="font-size:13px;color:var(--muted);font-style:italic">' + esc(t.py) + '</span>' : '')));
    if (t.note) b.appendChild(el('div', 'n', (t.w ? '⚠ ' : '') + esc(t.note)));
    c.appendChild(b);
  } else {
    c.appendChild(el('div', 'hint', 'Bấm vào thẻ để xem đáp án'));
  }
  c.onclick = () => { fshow = !fshow; drawFlash(); };
}
$('#fyes').onclick = () => { const t = fdeck[fi]; if (!t) return; const k = known(); k[t.i] = 1; store('mk_known', k); fi++; fshow = false; drawFlash(); };
$('#fno').onclick = () => { const t = fdeck[fi]; if (!t) return; const k = known(); delete k[t.i]; store('mk_known', k); fdeck.push(t); fi++; fshow = false; drawFlash(); };
$('#freset').onclick = () => { store('mk_known', {}); buildDeck(); };
buildDeck();

/* ---------- quiz ---------- */
let qmode = 'all', qcur = null, qn = 0, qok = 0;
$('#qmode').querySelectorAll('button').forEach(b => b.onclick = () => {
  qmode = b.dataset.m; $('#qmode').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  qn = 0; qok = 0; nextQ();
});
function pool() { return qmode === 'warn' ? D.terms.filter(t => t.w) : D.terms; }
function nextQ() {
  const p = pool();
  if (qn >= 12) { showScore(); return; }
  const t = p[Math.floor(Math.random() * p.length)];
  let same = D.terms.filter(x => x.c === t.c && x.i !== t.i && x.vi !== t.vi);
  if (same.length < 3) same = D.terms.filter(x => x.i !== t.i && x.vi !== t.vi);
  const wrong = same.sort(() => Math.random() - .5).slice(0, 3);
  qcur = { t, opts: [t].concat(wrong).sort(() => Math.random() - .5) };
  const box = $('#qbody'); box.innerHTML = '';
  box.appendChild(el('div', 'meta', '<span>Câu ' + (qn + 1) + '/12</span><span>Đúng ' + qok + '</span>'));
  box.appendChild(el('div', 'q' + (t.zh.length > 6 ? ' small' : '') + ' zh', esc(t.zh)));
  box.appendChild(el('div', 'qsub', esc(t.py || '') + ' · nghĩa tiếng Việt trong nghề là gì?'));
  const o = el('div', 'opts');
  qcur.opts.forEach(x => {
    const b = el('button', 'opt', esc(x.vi));
    b.onclick = () => answer(b, x, o);
    o.appendChild(b);
  });
  box.appendChild(o);
}
function answer(btn, pick, box) {
  const t = qcur.t;
  [...box.children].forEach(b => { b.disabled = true; });
  const right = pick.i === t.i;
  if (right) { qok++; btn.classList.add('right'); }
  else {
    btn.classList.add('wrong');
    [...box.children].forEach(b => { if (b.textContent === t.vi) b.classList.add('right'); });
  }
  qn++;
  const e = el('div', 'exp', '<b>' + esc(t.zh) + '</b> → <b style="color:var(--accent)">' + esc(t.vi) + '</b>' + (t.note ? '<br>' + (t.w ? '⚠ ' : '') + esc(t.note) : ''));
  $('#qbody').appendChild(e);
  const nb = el('button', 'nextb', qn >= 12 ? 'Xem kết quả' : 'Câu tiếp →');
  nb.onclick = nextQ;
  $('#qbody').appendChild(nb);
  nb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function showScore() {
  const box = $('#qbody'); box.innerHTML = '';
  const s = el('div', 'score');
  s.appendChild(el('div', 'big', qok + '/12'));
  s.appendChild(el('div', '', qok >= 10 ? 'Chắc rồi — chuyển sang nhóm khác.' : qok >= 7 ? 'Ổn. Làm thêm một lượt nữa.' : 'Quay lại phần Thẻ nhớ trước đã.'));
  box.appendChild(s);
  const nb = el('button', 'nextb', 'Làm lại'); nb.onclick = () => { qn = 0; qok = 0; nextQ(); };
  box.appendChild(nb);
}

/* ---------- phrases ---------- */
let pg = 'Tất cả';
const pgs = ['Tất cả'].concat([...new Set(D.phrases.map(p => p.g))]);
const pchips = $('#pchips');
pgs.forEach(g => {
  const b = el('button', 'chip' + (g === 'Tất cả' ? ' on' : ''), esc(g));
  b.onclick = () => { pg = g; [...pchips.children].forEach(x => x.classList.toggle('on', x === b)); drawP(); };
  pchips.appendChild(b);
});
function drawP() {
  const q = $('#pq').value.trim(), nq = norm(q);
  $('#pcx').style.display = q ? 'block' : 'none';
  const list = D.phrases.filter(p => (pg === 'Tất cả' || p.g === pg) && (!nq || p._s.includes(nq)));
  const box = $('#pres'); box.innerHTML = '';
  if (!list.length) { box.appendChild(el('div', 'empty', 'Không có mẫu câu khớp.')); return; }
  let cur = '';
  const f = document.createDocumentFragment();
  list.forEach(p => {
    if (p.g !== cur) { cur = p.g; f.appendChild(el('div', 'sect', esc(cur))); }
    const c = el('div', 'p-card' + (p.rev ? ' p-rev' : ''));
    if (p.rev) {
      c.appendChild(el('div', 'p-vi', hl(p.vi, q)));
      c.appendChild(el('div', 'p-zh zh', hl(p.zh, q)));
    } else {
      if (p.zh) c.appendChild(el('div', 'p-zh zh', hl(p.zh, q)));
      if (p.vi) c.appendChild(el('div', 'p-vi', hl(p.vi, q)));
    }
    if (p.note) c.appendChild(el('div', 'p-note', esc(p.note)));
    f.appendChild(c);
  });
  box.appendChild(f);
}
$('#pq').oninput = drawP;
$('#pcx').onclick = () => { $('#pq').value = ''; drawP(); $('#pq').focus(); };
drawP();

/* ---------- top 20 ---------- */
(function () {
  const box = $('#topres');
  D.top20.forEach(t => {
    const c = el('div', 'card w');
    c.appendChild(el('div', 't-zh zh', esc(t.zh)));
    c.appendChild(el('div', 't-vi', esc(t.vi)));
    c.appendChild(el('div', 't-note', '⚠ ' + esc(t.why)));
    box.appendChild(c);
  });
})();

/* ---------- hash ---------- */
(function () {
  const h = (location.hash || '').replace('#', '');
  if (views.includes(h)) { const b = document.querySelector('.tab[data-v="' + h + '"]'); if (b) b.click(); }
})();
</script>
