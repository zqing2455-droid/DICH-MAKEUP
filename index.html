<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thuật ngữ Makeup Trung–Việt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#D6F1EF; --mint-soft:#E8F8F7; --mint-deep:#2E8F86;
  --cream:#FDF9EF; --card:#fff;
  --ink:#141414; --muted:#6E6760; --hair:rgba(20,20,20,.14);
  --purple:#9A8AF0; --purple-deep:#5F4BC9; --purple-soft:#EFECFD;
  --butter:#FCE9A4; --butter-soft:#FDF3CE; --butter-line:#E3C76B;
  --coral:#EE8574; --coral-soft:#FDEDE9;
  --shadow:0 2px 0 rgba(20,20,20,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--cream); color:var(--ink);
  font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
.zh{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif}
.serif{font-family:"Playfair Display",Georgia,serif}

header{
  position:sticky; top:0; z-index:20; background:var(--mint);
  border-bottom:1.5px solid var(--ink);
  padding:calc(12px + env(safe-area-inset-top)) 14px 0;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.brand h1{
  font-family:"Playfair Display",Georgia,serif; font-size:25px; margin:0;
  font-weight:600; letter-spacing:-.015em; line-height:1.1;
}
.brand .sub{font-size:11.5px;color:#3A5F5C;margin-top:2px;letter-spacing:.02em}
.brand svg{flex:0 0 auto;margin-left:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 11px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:1.5px solid var(--ink);background:#fff;color:var(--ink);
  padding:7px 15px;border-radius:999px;font-size:13.5px;font-weight:500;cursor:pointer;
  white-space:nowrap;font-family:inherit;transition:.12s;
}
.tab[aria-selected="true"]{background:var(--purple);color:#fff;font-weight:700}

main{padding:16px 14px 60px;max-width:760px;margin:0 auto}

.search{position:relative;margin-bottom:13px}
.search input{
  width:100%;padding:14px 42px 14px 17px;font-size:16px;font-family:inherit;color:var(--ink);
  border:1.5px solid var(--ink);border-radius:999px;background:#fff;outline:none;
}
.search input::placeholder{color:#9A938C}
.search input:focus{box-shadow:0 0 0 3px var(--purple-soft)}
.clearx{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);border:1.5px solid var(--ink);
  background:#fff;color:var(--ink);width:28px;height:28px;border-radius:50%;font-size:15px;
  line-height:1;cursor:pointer;display:none;font-family:inherit;padding:0;
}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 13px;padding:0 14px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1.5px solid var(--ink);background:#fff;color:var(--ink);
  padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:500;cursor:pointer;
  white-space:nowrap;font-family:inherit;
}
.chip.on{background:var(--ink);color:#fff;font-weight:700}
.chip.warn.on{background:var(--butter);color:var(--ink)}
.count{font-size:12.5px;color:var(--muted);margin:0 4px 10px}

.card{
  background:var(--card);border:1.5px solid var(--ink);border-radius:17px;padding:14px 15px;
  margin-bottom:10px;box-shadow:var(--shadow);
}
.card.w{background:var(--butter-soft);border-color:var(--ink)}
.row1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.t-zh{font-size:22px;font-weight:600;letter-spacing:.01em}
.t-py{font-size:12.5px;color:var(--muted);font-style:italic}
.t-vi{font-size:16.5px;font-weight:700;color:var(--purple-deep);margin-top:6px;line-height:1.35}
.card.w .t-vi{color:#7A5A00}
.t-note{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.5}
.card.w .t-note{color:#6B5416}
.t-cat{
  font-size:10.5px;color:var(--ink);background:var(--mint-soft);border:1px solid var(--hair);
  padding:2.5px 9px;border-radius:999px;display:inline-block;margin-top:9px;letter-spacing:.02em;
}
.card.w .t-cat{background:#fff}
.empty{text-align:center;color:var(--muted);padding:44px 10px;font-size:14.5px;line-height:1.6}
.sect{
  font-family:"Playfair Display",Georgia,serif;font-size:17px;font-weight:600;color:var(--ink);
  margin:22px 2px 10px;padding-bottom:6px;border-bottom:1.5px solid var(--ink);
}
.sect:first-child{margin-top:0}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:7px 14px;border-radius:999px;
  font-size:13.5px;font-weight:500;cursor:pointer;font-family:inherit;
}
.seg button.on{background:var(--purple);border-color:var(--ink);color:#fff;font-weight:700}

/* flashcards — purple card with butter inner, like the template */
.flash{
  background:var(--purple);border:1.5px solid var(--ink);border-radius:22px;
  min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 18px;text-align:center;cursor:pointer;margin-bottom:12px;position:relative;
  box-shadow:0 3px 0 rgba(20,20,20,.1);
}
.flash .front{font-size:40px;font-weight:600;line-height:1.25;color:#fff;padding:6px 0}
.flash .front.small{font-size:24px;font-family:"Playfair Display",Georgia,serif}
.flash .back{
  margin-top:16px;width:100%;background:var(--butter);border:1.5px solid var(--ink);
  border-radius:14px;padding:14px 15px;
}
.flash .back .v{font-size:21px;font-weight:700;color:var(--ink);line-height:1.3}
.flash .back .n{font-size:13px;color:#5E4B14;margin-top:9px;line-height:1.5;text-align:left}
.flash .hint{position:absolute;bottom:12px;font-size:11.5px;color:rgba(255,255,255,.8)}
.fbtns{display:flex;gap:9px}
.fbtns button{
  flex:1;padding:13px;border-radius:999px;border:1.5px solid var(--ink);font-size:14.5px;
  font-weight:700;cursor:pointer;background:#fff;color:var(--ink);font-family:inherit;
}
.fbtns .no{background:var(--butter)}
.fbtns .yes{background:var(--mint)}
.prog{height:7px;background:#fff;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--purple);transition:width .25s}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:9px;gap:10px}

/* quiz */
.q{font-size:36px;font-weight:600;text-align:center;padding:20px 10px 4px}
.q.small{font-size:23px}
.qsub{text-align:center;font-size:12.5px;color:var(--muted);font-style:italic;margin-bottom:17px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  text-align:left;padding:14px 16px;border-radius:15px;border:1.5px solid var(--ink);background:#fff;
  font-size:15.5px;cursor:pointer;color:var(--ink);font-family:inherit;line-height:1.4;box-shadow:var(--shadow);
}
.opt.right{background:var(--mint);font-weight:700}
.opt.wrong{background:var(--coral-soft);color:#A33A28}
.opt:disabled{cursor:default}
.exp{
  margin-top:13px;padding:14px 15px;border-radius:15px;background:var(--butter-soft);
  border:1.5px solid var(--ink);font-size:13.5px;line-height:1.55;
}
.nextb{
  width:100%;margin-top:12px;padding:14px;border-radius:999px;border:1.5px solid var(--ink);
  background:var(--purple);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
}
.score{
  text-align:center;padding:30px 18px;background:var(--mint);border:1.5px solid var(--ink);
  border-radius:22px;margin-bottom:12px;
}
.score .big{font-family:"Playfair Display",Georgia,serif;font-size:50px;font-weight:700;line-height:1.1}
.score .msg{font-size:14.5px;margin-top:6px}

/* phrases */
.p-card{background:#fff;border:1.5px solid var(--ink);border-radius:17px;padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.p-zh{font-size:17.5px;line-height:1.5}
.p-vi{font-size:15.5px;font-weight:700;color:var(--purple-deep);margin-top:7px;line-height:1.45}
.p-note{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5}
.p-rev{background:var(--mint-soft)}
.p-rev .p-vi{color:var(--ink);font-weight:500;margin-top:0}
.p-rev .p-zh{color:var(--purple-deep);font-weight:700;margin-top:7px}

/* luyện dịch */
.drill{
  background:#fff;border:1.5px solid var(--ink);border-radius:20px;padding:20px 17px;
  margin-bottom:11px;min-height:170px;box-shadow:0 3px 0 rgba(20,20,20,.08);cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;
}
.drill .src{font-size:23px;line-height:1.5;font-weight:500}
.drill .src.lat{font-size:19px;font-weight:500}
.drill .ans{margin-top:17px;background:var(--mint);border:1.5px solid var(--ink);border-radius:14px;padding:14px 15px}
.drill .ans .a{font-size:18.5px;font-weight:700;line-height:1.45}
.drill .ans .nn{font-size:12.5px;color:#275B56;margin-top:9px;line-height:1.5}
.drill .tapme{margin-top:17px;font-size:12.5px;color:var(--muted);font-style:italic}
.pass{
  background:#fff;border:1.5px solid var(--ink);border-radius:17px;padding:13px 15px;margin-bottom:10px;
  cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;gap:13px;text-align:left;width:100%;font-family:inherit;
}
.pass .num{
  flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--purple);border:1.5px solid var(--ink);
  color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;
}
.pass .tt{font-family:"Playfair Display",Georgia,serif;font-size:17.5px;font-weight:600;line-height:1.2}
.pass .mm{font-size:11.5px;color:var(--muted);margin-top:3px}
.ptext{
  background:var(--butter-soft);border:1.5px solid var(--ink);border-radius:17px;padding:17px 16px;
  font-size:19.5px;line-height:1.85;margin-bottom:12px;white-space:pre-wrap;
  font-family:"DM Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
.pvi{background:var(--mint-soft);border:1.5px solid var(--ink);border-radius:17px;padding:17px 16px;font-size:16px;line-height:1.7;margin-bottom:12px;white-space:pre-wrap}
.pnotes{background:#fff;border:1.5px solid var(--ink);border-radius:17px;padding:15px 16px;margin-bottom:12px}
.pnotes h4{margin:0 0 9px;font-family:"Playfair Display",Georgia,serif;font-size:16px;font-weight:600}
.pnotes li{font-size:13.5px;line-height:1.55;margin-bottom:7px;color:#3A352F}
.pnotes ul{margin:0;padding-left:19px}
.ptop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.backb{
  border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;
  font-weight:500;cursor:pointer;font-family:inherit;color:var(--ink);
}
.timer{
  margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);
  background:var(--butter);border:1.5px solid var(--ink);border-radius:999px;padding:5px 13px;font-size:14px;
}
/* cẩm nang kỹ năng */
.acc{background:#fff;border:1.5px solid var(--ink);border-radius:17px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.acc-h{
  width:100%;text-align:left;background:#fff;border:0;border-bottom:1.5px solid transparent;
  padding:15px 16px;font-family:"Playfair Display",Georgia,serif;font-size:17.5px;font-weight:600;
  color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:11px;line-height:1.25;
}
.acc.open .acc-h{background:var(--mint);border-bottom-color:var(--ink)}
.acc-h .ar{margin-left:auto;flex:0 0 auto;font-size:14px;transition:transform .18s;font-family:"DM Sans",sans-serif}
.acc.open .acc-h .ar{transform:rotate(180deg)}
.acc-h .no{
  flex:0 0 auto;width:27px;height:27px;border-radius:50%;background:var(--purple);border:1.5px solid var(--ink);
  color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;font-family:"DM Sans",sans-serif;
}
.acc-b{padding:15px 16px 17px;display:none}
.acc.open .acc-b{display:block}
.acc-b p{margin:0 0 12px;font-size:14.5px;line-height:1.6;color:#3A352F}
.acc-b h4{
  margin:18px 0 9px;font-family:"Playfair Display",Georgia,serif;font-size:16px;font-weight:600;
  padding-bottom:5px;border-bottom:1.5px solid var(--ink);
}
.acc-b h4:first-child{margin-top:0}
.acc-b ul{margin:0 0 12px;padding-left:20px}
.acc-b li{font-size:14px;line-height:1.6;margin-bottom:8px;color:#3A352F}
.dcard{border:1.5px solid var(--ink);border-radius:14px;padding:13px 14px;margin-bottom:10px;background:var(--cream)}
.dcard .dt{font-weight:700;font-size:15.5px;margin-bottom:9px;padding-bottom:7px;border-bottom:1.5px dashed var(--hair)}
.drow{display:flex;gap:10px;margin-bottom:7px;font-size:13.5px;line-height:1.5}
.drow .dk{flex:0 0 96px;color:var(--muted);font-weight:500}
.drow .dv{flex:1}
.d2{border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:9px;background:#fff}
.d2 .dt{font-weight:700;font-size:14.5px;margin-bottom:5px}
.d2 .dd{font-size:13.5px;line-height:1.55;color:#3A352F}
.symg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.symg div{border:1.5px solid var(--ink);border-radius:11px;padding:8px 10px;background:var(--butter-soft);font-size:12.5px;line-height:1.35}
.symg b{display:block;font-size:15px;margin-bottom:2px}
.gbox{border:1.5px solid var(--ink);border-radius:14px;padding:14px 15px;margin:14px 0 12px}
.gbox.mint{background:var(--mint-soft)}
.gbox.warn{background:var(--butter-soft)}
.gbox .gt{font-weight:700;font-size:14.5px;margin-bottom:9px}
.gbox .gl{font-size:13.5px;line-height:1.55;margin-bottom:7px;color:#3A352F}
.chkrow{
  display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--ink);
  border-radius:12px;margin-bottom:7px;cursor:pointer;background:#fff;font-size:13.5px;line-height:1.5;
}
.chkrow.done{background:var(--mint);text-decoration:line-through;text-decoration-color:rgba(20,20,20,.35)}
.chkrow .bx{
  flex:0 0 auto;width:19px;height:19px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px;
}
.chkrow.done .bx{background:var(--purple);color:#fff}
mark{background:var(--butter);color:inherit;padding:0 2px;border-radius:3px}
.hide{display:none!important}
.foot{
  text-align:center;font-size:12px;color:var(--muted);padding:26px 14px 8px;line-height:1.7;
  border-top:1.5px solid var(--ink);margin-top:26px;
}
.foot b{font-family:"Playfair Display",Georgia,serif;font-weight:600;color:var(--ink)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div>
      <h1>Thuật ngữ Makeup</h1>
      <div class="sub">TRUNG – VIỆT · 中越美妆 · tra cứu &amp; luyện</div>
    </div>
    <svg width="54" height="40" viewBox="0 0 54 40" fill="none" aria-hidden="true">
      <rect x="4" y="15" width="9" height="21" rx="2" fill="#9A8AF0" stroke="#141414" stroke-width="1.6"/>
      <path d="M8.5 15V8c0-2 .8-3.5 2-3.5s2 1.5 2 3.5v7" stroke="#141414" stroke-width="1.6" fill="#FCE9A4"/>
      <circle cx="29" cy="22" r="12" fill="#FCE9A4" stroke="#141414" stroke-width="1.6"/>
      <circle cx="29" cy="22" r="5" fill="#D6F1EF" stroke="#141414" stroke-width="1.6"/>
      <rect x="42" y="18" width="8" height="18" rx="1.6" fill="#fff" stroke="#141414" stroke-width="1.6"/>
      <path d="M43.6 18V9.5c0-1.2.9-2 2.4-2s2.4.8 2.4 2V18" fill="#9A8AF0" stroke="#141414" stroke-width="1.6"/>
    </svg>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-v="look">Tra cứu</button>
    <button class="tab" role="tab" aria-selected="false" data-v="flash">Thẻ nhớ</button>
    <button class="tab" role="tab" aria-selected="false" data-v="quiz">Kiểm tra</button>
    <button class="tab" role="tab" aria-selected="false" data-v="prac">Luyện dịch</button>
    <button class="tab" role="tab" aria-selected="false" data-v="phr">Mẫu câu</button>
    <button class="tab" role="tab" aria-selected="false" data-v="skill">Kỹ năng</button>
    <button class="tab" role="tab" aria-selected="false" data-v="top">20 từ bẫy</button>
  </div>
</header>
<main>
  <section id="look">
    <div class="search">
      <input id="q" type="search" placeholder="Gõ tiếng Trung, pinyin hoặc tiếng Việt…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="clearx" id="cx" aria-label="Xoá">×</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
    <div id="res"></div>
  </section>

  <section id="flash" class="hide">
    <div class="seg" id="dir" style="margin-bottom:11px">
      <button class="on" data-d="zh">中文 → Việt</button>
      <button data-d="vi">Việt → 中文</button>
    </div>
    <div class="chips" id="fcat"></div>
    <div class="meta">
      <span id="fmeta"></span>
      <button id="freset" style="border:0;background:none;color:var(--purple-deep);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;padding:0;text-decoration:underline;flex:0 0 auto">Học lại từ đầu</button>
    </div>
    <div class="prog"><i id="fprog" style="width:0%"></i></div>
    <div class="flash" id="fcard"></div>
    <div class="fbtns">
      <button class="no" id="fno">Chưa thuộc</button>
      <button class="yes" id="fyes">Thuộc rồi</button>
    </div>
  </section>

  <section id="quiz" class="hide">
    <div class="seg" id="qmode" style="margin-bottom:14px">
      <button class="on" data-m="all">Tất cả</button>
      <button data-m="warn">Chỉ từ bẫy</button>
    </div>
    <div id="qbody"></div>
  </section>

  <section id="prac" class="hide">
    <div class="seg" id="pmode" style="margin-bottom:12px">
      <button class="on" data-p="sent">Câu ngắn</button>
      <button data-p="para">Đoạn dài</button>
    </div>

    <div id="sentbox">
      <div class="seg" id="sdir" style="margin-bottom:10px">
        <button class="on" data-d="zh">中文 → Việt</button>
        <button data-d="vi">Việt → 中文</button>
      </div>
      <div class="chips" id="sgrp"></div>
      <div class="meta"><span id="smeta"></span></div>
      <div class="drill" id="scard"></div>
      <button class="nextb" id="snext">Câu tiếp →</button>
    </div>

    <div id="parabox" class="hide">
      <div id="plist"></div>
      <div id="pdetail" class="hide"></div>
    </div>
  </section>

  <section id="phr" class="hide">
    <div class="search">
      <input id="pq" type="search" placeholder="Tìm mẫu câu…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="clearx" id="pcx" aria-label="Xoá">×</button>
    </div>
    <div class="chips" id="pchips"></div>
    <div id="pres"></div>
  </section>

  <section id="skill" class="hide">
    <div class="count">Kỹ năng phiên dịch hiện trường &amp; kế hoạch luyện tập. Bấm vào từng mục để mở.</div>
    <div id="gres"></div>
  </section>

  <section id="top" class="hide">

i cô","zh":"老师，我们先对一下今天的流程好吗？","vi":"Xin cô cho em rà lại quy trình buổi hôm nay một lượt.","note":"Làm trước giờ học 20–30 phút."},{"g":"Trước giờ học — chốt với cô","zh":"老师，今天会用到哪些产品？能给我看一下包装吗？","vi":"Hôm nay cô dùng những sản phẩm nào ạ? Cho em xem vỏ hộp với.","note":"Chụp ảnh vỏ hộp — tên thương hiệu khó nghe nhất."},{"g":"Trước giờ học — chốt với cô","zh":"示范的时候，请您每一两句停一下，我好翻。","vi":"(Thoả thuận với cô) Khi làm mẫu, cô nói một hai câu rồi dừng cho em dịch.","note":"Điều quan trọng nhất phải chốt trước."},{"g":"Trước giờ học — chốt với cô","zh":"我举手就是请您停一下。","vi":"Em giơ tay nghĩa là xin cô dừng một chút.","note":"Chốt một ám hiệu tay."},{"g":"Trước giờ học — chốt với cô","zh":"品牌名、数字、价格，请您说慢一点或写下来。","vi":"Tên thương hiệu, con số, giá — xin cô nói chậm hoặc viết ra.","note":"Đây là chỗ dịch sai nguy hiểm nhất."},{"g":"Trước giờ học — chốt với cô","zh":"如果我翻错了，请直接用中文告诉我。","vi":"Nếu em dịch sai, cô cứ nói thẳng bằng tiếng Trung cho em.","note":"Thà sửa tại chỗ còn hơn sai cả buổi."},{"g":"Trước giờ học — chốt với cô","zh":"理论部分我可以整段翻，示范部分我紧跟着翻。","vi":"Phần lý thuyết em dịch theo đoạn, phần làm mẫu em dịch bám sát từng câu.","note":"Hai chế độ khác nhau — nói rõ để cô biết nhịp."},{"g":"Trước giờ học — chốt với cô","zh":"学员都是行业内的，很多英文词他们懂。","vi":"Học viên đều đang làm nghề, nhiều từ tiếng Anh họ hiểu hết.","note":"Để cô yên tâm khi bạn giữ nguyên tiếng Anh."},{"g":"Mở đầu & tổ chức lớp","zh":"大家好，我是今天的翻译。","vi":"Chào cả lớp, em là phiên dịch của buổi học hôm nay ạ.","note":""},{"g":"Mở đầu & tổ chức lớp","zh":"今天我们学习……","vi":"Hôm nay chúng ta sẽ học…","note":""},{"g":"Mở đầu & tổ chức lớp","zh":"我先示范一遍，大家先看，不要动手。","vi":"Cô làm mẫu một lượt trước. Mọi người xem đã, chưa làm theo vội nhé.","note":""},{"g":"Mở đầu & tổ chức lớp","zh":"现在请大家把工具准备好。","vi":"Bây giờ mọi người chuẩn bị dụng cụ ra nhé.","note":""},{"g":"Mở đầu & tổ chức lớp","zh":"两人一组，互相化。","vi":"Chia hai người một nhóm, làm cho nhau nhé.","note":""},{"g":"Mở đầu & tổ chức lớp","zh":"大家能看清吗？往前坐一点。","vi": g để dính liền nhau.","note":"打碎 / 阻断 — xem sổ thuật ngữ."},{"g":"Cô làm mẫu — giải thích","zh":"眉色由深到浅：眉中最深，眉头最浅。","vi":"Màu chân mày đậm dần rồi nhạt: giữa mày đậm nhất, đầu mày nhạt nhất.","note":""},{"g":"Khẩu lệnh thao tác","zh":"少量多次。","vi":"Lấy ít thôi, làm nhiều lần.","note":""},{"g":"Khẩu lệnh thao tác","zh":"轻一点。／再轻一点。","vi":"Nhẹ tay hơn. / Nhẹ nữa.","note":""},{"g":"Khẩu lệnh thao tác","zh":"慢一点。","vi":"Chậm lại.","note":""},{"g":"Khẩu lệnh thao tác","zh":"力度再小一点。","vi":"Giảm lực tay xuống.","note":""},{"g":"Khẩu lệnh thao tác","zh":"从内往外。／从外往内。","vi":"Từ trong ra ngoài. / Từ ngoài vào trong.","note":""},{"g":"Khẩu lệnh thao tác","zh":"往上提。／往下带。","vi":"Hất lên trên. / Đưa nhẹ xuống dưới.","note":""},{"g":"Khẩu lệnh thao tác","zh":"再晕染一下。","vi":"Tán thêm chút nữa. / Blend thêm đi.","note":""},{"g":"Khẩu lệnh thao tác","zh":"边缘收干净。","vi":"Làm gọn phần viền lại.","note":""},{"g":"Khẩu lệnh thao tác","zh":"停，先别加了。","vi":"Dừng, đừng thêm nữa.","note":""},{"g":"Khẩu lệnh thao tác","zh":"换一支干净的刷子。","vi":"Đổi sang cọ sạch.","note":""},{"g":"Khẩu lệnh thao tác","zh":"把刷子上的粉抖一抖。","vi":"Gõ bớt phấn trên cọ đi.","note":""},{"g":"Khẩu lệnh thao tác","zh":"蘸一点点就够了。","vi":"Chấm một xíu là đủ.","note":""},{"g":"Khẩu lệnh thao tác","zh":"这里补一点。","vi":"Chỗ này dặm thêm chút.","note":""},{"g":"Khẩu lệnh thao tác","zh":"对，就是这样。","vi":"Đúng rồi, đúng kiểu đó.","note":""},{"g":"Khẩu lệnh thao tác","zh":"再来一遍。","vi":"Làm lại một lần nữa.","note":""},{"g":"Khẩu lệnh thao tác","zh":"两边要对称。","vi":"Hai bên phải cân nhau.","note":""},{"g":"Khẩu lệnh thao tác","zh":"先定妆，再上腮红。","vi":"Khoá nền xong rồi mới đánh má.","note":""},{"g":"Khẩu lệnh thao tác","zh":"等一下，让它成膜。","vi":"Chờ chút cho nó set lại đã.","note":""},{"g":"Khẩu lệnh thao tác","zh":"用美妆蛋按压，不要抹。","vi":"Dùng mút ấn xuống, đừng miết.","note":""},{"g":"Khẩu lệnh thao tác","zh":"拍，不要推。","vi":"Vỗ, đừng đẩy.","note":""},{"g":"Khẩu lệnh thao tác","zh":"照镜子看一下整体。","vi":"Soi gương nhìn tổng thể một cái.","note":""},{"g":"Khẩu lệnh thao tác","zh":"退远一点看。","vi":"Lùi ra xa nhìn thử.","note":""},{"g":"Khẩu lệnh thao tác","zh":"好，下一步。","vi":"Rồi, sang bước tiếp theo.","note":""},{"g":"Sửa lỗi & nhắc nhở","zh":"你的粉底太厚了。","vi":"Lớp nền của em dày quá.","note":""},{"g":"Sửa lỗi & nhắc nhở","zh":"这里颜色断层了。","vi":"Chỗ này màu bị đứt đoạn rồi.","note":""},{"g":"Sửa lỗi & nhắc nhở","zh":"要过渡自然一点。","vi":"Phải tán cho màu chuyển tự nhiên hơn.","note":""},{"g":"Sửa lỗi & nhắc nhở","zh":"边界太明显了。","vi":"Đường ranh rõ quá.","note":""},{"g":"Sửa lỗi & nhắc nhở","zh":"你刷子拿得太靠前了。","vi":"Em cầm cọ sát đầu quá.","note":"Cầm sát đầu cọ thì không kiểm soát được lực."},{"g":"Sửa lỗi & nhắc nhở","zh":"两边不对称。","vi":"Hai bên không cân.","note":""},{"g":"Sửa lỗi & nhắc nhở","zh":"这个位置偏高了／偏低了。","vi":"Vị trí này cao quá / thấp quá rồi.","note":""},{"g":"Sửa lỗi & nhắc nhở","zh":"你下手太重了。","vi":"Em làm mạnh tay quá.","note":""},{"g":"Sửa lỗi & nhắc nhở","zh":"顺序错了，要先……再……","vi":"Sai thứ tự rồi — phải … trước, rồi mới …","note":""},{"g":"Sửa lỗi & nhắc nhở","zh":"产品用多了，擦掉一点。","vi":"Lấy nhiều sản phẩm quá, lau bớt đi.","note":""},{"g":"Sửa lỗi & nhắc nhở","zh":"没关系，重来就好。","vi":"Không sao, làm lại là được.","note":"Giọng phải nhẹ — đây là câu trấn an."},{"g":"Sửa lỗi & nhắc nhở","zh":"别急，慢慢来。","vi":"Từ từ thôi, không vội.","note":""},{"g":"Nhận xét","zh":"整体不错，但是……","vi":"Tổng thể ổn đấy, nhưng…","note":""},{"g":"Nhận xét","zh":"比刚才进步很多。","vi":"Tiến bộ hơn lúc nãy nhiều.","note":""},{"g":"Nhận xét","zh":"这个眼影晕染得很漂亮。","vi":"Phần mắt em tán đẹp đấy.","note":""},{"g":"Nhận xét","zh":"底妆还要再练。","vi":"Phần nền cần luyện thêm.","note":""},{"g":"Nhận xét","zh":"很好，保持这个手法。","vi":"Tốt, giữ nguyên cách làm này.","note":""},{"g":"Nhận xét","zh":"你的手很稳。","vi":"Tay em vững đấy.","note":""},{"g":"Học viên hỏi → bạn dịch sang 中文","zh":"老师，油皮应该用哪一种？","vi":"Cô ơi, da dầu thì nên dùng loại nào ạ?","note":"","rev":1},{"g":"Học viên hỏi → bạn dịch sang 中文","zh":"法令纹那里卡粉怎么办？","vi":"Bị đọng phấn ở rãnh cười thì xử lý sao ạ?","note":"","rev":1},{"g":"Học viên hỏi → bạn dịch sang 中文","zh":"我是外油内干，怎么处理？","vi":"Da em bị mất nước mà vẫn đổ dầu thì sao ạ?","note":"","rev":1},{"g":"Học viên hỏi → bạn dịch sang 中文","zh":"这个产品在越南买得到吗？","vi":"Sản phẩm này ở Việt Nam mua được không ạ?","note":"","rev":1},{"g":"Học viên hỏi → bạn dịch sang 中文","zh":"老师，能再示范一遍吗？","vi":"Cô làm lại cho em xem lần nữa được không ạ?","note":"","rev":1},{"g":"Học viên hỏi → bạn dịch sang 中文","zh":"这一步可以省略吗？","vi":"Bước này bỏ qua được không ạ?","note":"","rev":1},{"g":"Học viên hỏi → bạn dịch sang 中文","zh":"深肤色的客人怎么选色号？","vi":"Khách da ngăm thì chọn số màu thế nào ạ?","note":"","rev":1},{"g":"Học viên hỏi → bạn dịch sang 中文","zh":"新娘妆有什么不一样？","vi":"Makeup cô dâu thì khác chỗ nào ạ?","note":"","rev":1},{"g":"Cô trả lời","zh":"这个问题很好。","vi":"Câu hỏi hay đấy.","note":""},{"g":"Cô trả lời","zh":"这要看个人肤质。","vi":"Cái này còn tuỳ loại da từng người.","note":""},{"g":"Cô trả lời","zh":"我再示范一遍。","vi":"Cô làm mẫu lại một lần nữa.","note":""},{"g":"Cô trả lời","zh":"这个我们下午讲。","vi":"Phần này chiều mình nói nhé.","note":""},{"g":"Cô trả lời","zh":"你可以用……代替。","vi":"Em có thể dùng … thay thế.","note":""},{"g":"Cô trả lời","zh":"不一定，要看场合。","vi":"Không nhất thiết, còn tuỳ dịp.","note":""},{"g":"Kết thúc buổi học","zh":"今天就到这里。","vi":"Hôm nay mình dừng ở đây nhé.","note":""},{"g":"Kết thúc buổi học","zh":"回去一定要练。","vi":"Về nhà nhớ luyện nhé.","note":""},{"g":"Kết thúc buổi học","zh":"明天我们学……","vi":"Ngày mai mình học…","note":""},{"g":"Kết thúc buổi học","zh":"谢谢大家，辛苦了。","vi":"Cảm ơn cả lớp, mọi người vất vả rồi.","note":"辛苦了 — đừng dịch “vất vả rồi” trơ trọi."},{"g":"Cứu nguy — nói với cô (中文)","zh":"老师，这个词我跟您确认一下，是指……吗？","vi":"","note":"Cách làm chuyên nghiệp, không phải mất mặt."},{"g":"Cứu nguy — nói với cô (中文)","zh":"老师，稍等一下，我先翻译。","vi":"","note":"Dùng khi cô nói quá dài."},{"g":"Cứu nguy — nói với cô (中文)","zh":"老师，可以说慢一点吗？学员要跟着做。","vi":"","note":""},{"g":"Cứu nguy — nói với cô (中文)","zh":"老师，这个牌子名请再说一遍，我写下来。","vi":"","note":""},{"g":"Cứu nguy — nói với cô (中文)","zh":"老师，刚才那句我没听清，麻烦再说一次。","vi":"","note":"Thà hỏi lại còn hơn đoán."},{"g":"Cứu nguy — nói với cô (中文)","zh":"老师，这里停一下，让他们先做完好吗？","vi":"","note":""},{"g":"Cứu nguy — nói với cô (中文)","zh":"老师，有学员问……","vi":"","note":"Mở đầu khi chuyển câu hỏi của học viên."},{"g":"Cứu nguy — nói với học viên","zh":"","vi":"Mọi người chờ em dịch xong rồi hãy làm nhé.","note":""},{"g":"Cứu nguy — nói với học viên","zh":"","vi":"Em xin phép xác nhận lại với cô một chút ạ.","note":"Nói rồi quay sang hỏi cô — lớp sẽ chờ."},{"g":"Cứu nguy — nói với học viên","zh":"","vi":"Từ này trong nghề mình hay gọi là gì ạ? Mọi người giúp em với.","note":"Vũ khí mạnh nhất: học viên biết tiếng Việt nghề hơn bạn."},{"g":"Cứu nguy — nói với học viên","zh":"","vi":"Em dịch lại cho rõ hơn ạ.","note":"Dùng khi bạn vừa dịch vụng."},{"g":"Cứu nguy — nói với học viên","zh":"","vi":"Ý cô là … — em diễn giải lại cho dễ hiểu ạ.","note":"Khi phải giải thích thay vì dịch sát."},{"g":"Cứu nguy — nói với học viên","zh":"","vi":"Bạn nói chậm giúp em để em dịch cho cô ạ.","note":""}],"cats":["Lớp nền","Che khuyết điểm","Tạo khối · Highlight","Mắt","Chân mày","Môi","Dụng cụ","Vùng mặt","Loại da","Hiệu ứng & lỗi","Động từ kỹ thuật","Màu sắc","Phong cách"],"passages":[{"t":"Lớp nền","c":"底妆","lv":"Cơ bản","zh":"好，我们现在开始上底妆。记住一个原则：少量多次。粉底不要一次全倒在手背上，挤一点点就够了。先从面中开始——就是脸颊、鼻子这一块大面积的区域，这里可以厚一点。然后往外推，越到脸的边际越薄，不然跟脖子会有色差。用美妆蛋的时候是按压，不是抹；抹会把底妆推开，反而不服帖。大家看我手上的动作，是拍、拍、拍。干皮的姐妹注意，如果你上完粉底觉得浮粉，那是前面保湿没做够，不是粉底的问题。","vi":"Rồi, bây giờ mình vào lớp nền. Nhớ một nguyên tắc: lấy ít thôi, làm nhiều lần. Đừng đổ hết kem nền ra mu bàn tay một lúc — bóp ra một xíu là đủ. Bắt đầu từ vùng giữa mặt, tức là hai bên má với mũi, chỗ diện tích rộng này thì để dày hơn một chút. Sau đó tán dần ra ngoài, càng ra rìa mặt càng phải mỏng, không thì sẽ lệch màu với cổ. Khi dùng mút thì phải ấn, không phải miết — miết sẽ đẩy lớp nền đi, nền lại càng không bám da. Mọi người nhìn tay cô đây này: vỗ, vỗ, vỗ. Bạn nào da khô chú ý: nếu đánh nền xong thấy nền bị nổi lên, là do bước dưỡng ẩm phía trước chưa đủ, chứ không phải lỗi của kem nền.","n":["面中 — “vùng giữa mặt”, không phải “mặt ở giữa”. Cô sẽ chỉ tay, bạn dịch kèm động tác chỉ.","脸的边际 — “rìa mặt”. Đừng dịch “biên giới của khuôn mặt”.","按压 vs 抹 — cả đoạn xoay quanh cặp đối lập này: ẤN chứ không MIẾT. Dịch rõ hai động tác khác nhau, nếu không học viên làm sai.","服帖 → “bám da”; 浮粉 → “nền bị nổi lên”. Hai từ này hay đi cùng nhau.","姐妹们 — dịch “các bạn” / “mọi người”, đừng dịch “chị em” nghe sỗ trong lớp nghề."]},{"t":"Tạo khối","c":"修容","lv":"Cơ bản","zh":"修容最怕什么？最怕一条杠。很多人画鼻影就是两条直线从眉头拉到鼻头，这样不仅不显鼻子小，还会显中庭长。正确的做法是分段：先在山根这里轻轻带一下，颜色一定要浅；然后鼻头、鼻翼这里再加强。刷子要蓬松一点，取完粉先在手背上匀一匀，不要直接上脸。记住，高光和阴影要打碎、阻断，不要连成一片，连成一片就假了。","vi":"Tạo khối sợ nhất điều gì? Sợ nhất là thành một vệt thẳng. Rất nhiều người đánh khối mũi là kéo hai đường thẳng từ đầu mày xuống đầu mũi — làm vậy không những mũi không nhỏ đi, mà còn làm phần giữa mặt trông dài ra. Cách đúng là chia đoạn: trước tiên đi nhẹ một đường ở gốc mũi, màu nhất định phải nhạt; sau đó mới nhấn thêm ở đầu mũi và cánh mũi. Cọ phải tơi một chút, lấy phấn xong thì gõ bớt lên mu bàn tay đã, đừng đưa thẳng lên mặt. Nhớ nhé: highlight với vùng tối phải tán tơi ra, cắt mạch, đừng để nối liền thành một mảng — liền một mảng là giả ngay.","n":["一条杠 — khẩu ngữ, “một vệt thẳng đơ”. Dịch theo hình ảnh, đừng tra từ điển.","中庭 — phần giữa mặt theo tỉ lệ 三庭. Lớp chưa học 三庭五眼 thì dịch “phần giữa mặt” rồi chỉ tay.","山根 — “gốc mũi”, điểm thấp giữa hai mắt. KHÔNG phải cả sống mũi.","带一下 — “đi nhẹ một đường”. Từ bạn sẽ nghe cả trăm lần.","匀一匀 — “gõ bớt / dàn đều phấn trên cọ”. Từ điển không có.","打碎、阻断 — “tán tơi ra, cắt mạch, đừng để nối liền”. Dịch chữ là vô nghĩa."]},{"t":"Trang điểm mắt","c":"眼妆","lv":"Cơ bản","zh":"眼影的关键不是颜色多漂亮，是晕染。先用珠光色打底，把整个眼窝铺满，这一层是做过渡用的。然后用哑光的深色，从眼尾往眼头晕，注意眼尾要重、眼头要轻，这样眼睛才显得有层次。下眼影不要用太深的颜色，用修容色整体带一下就可以了。如果你发现颜色断层了，说明中间那一层没做够，不要急着加深色，先把过渡色补上去。","vi":"Điểm then chốt của phấn mắt không phải màu đẹp tới đâu, mà là tán. Đầu tiên lót bằng màu nhũ, phủ kín cả hốc mắt — lớp này là để chuyển màu. Sau đó lấy màu đậm matte, tán từ đuôi mắt về phía đầu mắt; nhớ là đuôi mắt phải đậm, đầu mắt phải nhạt, như vậy mắt mới có lớp lang. Phần mí dưới thì đừng dùng màu quá đậm, lấy màu tạo khối đi nhẹ một lượt là đủ. Nếu thấy màu bị đứt đoạn, nghĩa là lớp ở giữa chưa làm đủ — đừng vội thêm màu đậm, hãy bù màu chuyển tiếp vào trước.","n":["晕染 — động từ số một. “Tán” hoặc “blend”, dân nghề quen “blend”.","眼窝 — “hốc mắt”, vùng lõm trên mí. Không phải “ổ mắt”.","断层 — “màu bị đứt đoạn”. Dân nghề Việt cũng nói “bị đứt màu”.","有层次 — “có lớp lang / có chiều sâu”. Đừng dịch “có tầng lớp”.","Cảnh giác: 晕染 (tán — tốt) đừng lẫn với 晕妆 (nhoè — lỗi). Gần âm, nghĩa trái ngược."]},{"t":"Chân mày","c":"眉妆","lv":"Trung bình","zh":"画眉毛最容易出问题的地方，是大家习惯从眉头开始画。眉头是最后画的，而且要最浅。顺序应该是：先定眉峰和眉尾的位置，把框架搭起来，中间填满，最后用螺旋刷把眉头带一下就行了。颜色的深浅关系记住这个顺序：眉中最深，然后是眉底、眉尾，眉上缘再浅一点，眉头最浅。还有一点，眉毛不是画出来的，是梳出来的——每画几笔就用螺旋刷顺一遍，让它有毛流感，不然就是两块色块贴在脸上。","vi":"Chỗ hay hỏng nhất khi vẽ chân mày là mọi người quen bắt đầu từ đầu mày. Đầu mày phải vẽ sau cùng, và phải nhạt nhất. Thứ tự đúng là: xác định vị trí đỉnh mày và đuôi mày trước để dựng khung, rồi lấp đầy phần giữa, cuối cùng mới lấy cọ xoắn đi nhẹ qua đầu mày là xong. Về độ đậm nhạt, nhớ thứ tự này: giữa mày đậm nhất, rồi đến viền dưới mày, đuôi mày, viền trên mày nhạt hơn nữa, đầu mày nhạt nhất. Thêm một điều: chân mày không phải vẽ ra, mà là chải ra — cứ vẽ vài nét lại lấy cọ xoắn chải một lượt cho ra sợi mày, không thì chỉ là hai mảng màu dán lên mặt.","n":["Đoạn này có 5 vị trí trên mày liền nhau: 眉头 đầu mày · 眉峰 đỉnh mày · 眉尾 đuôi mày · 眉上缘 viền trên · 眉底 viền dưới. Sai một chỗ là học viên vẽ sai chỗ.","搭框架 — “dựng khung”, nghĩa bóng. Đừng dịch “bắc giàn giáo”.","毛流感 — “cho ra sợi mày / thấy từng sợi tự nhiên”, không phải “cảm giác dòng lông”.","色块 — “mảng màu”. Cả câu cuối là lời chê: vẽ sai thì mày trông như hai mảng màu dán lên.","Câu “不是画出来的，是梳出来的” là một vế đối — giữ được cấu trúc đối trong tiếng Việt: “không phải vẽ ra, mà là chải ra”."]},{"t":"Hỏi đáp về da (hai chiều)","c":"肤质答疑","lv":"Khó","zh":"（学员提问，bạn dịch sang tiếng Trung trước)\nCô ơi, da em là da dầu nhưng cứ makeup xong khoảng hai tiếng là bị loang lổ từng mảng, nhất là vùng chữ T. Như vậy là do kem nền hay do bước khoá nền ạ?\n\n（老师回答，bạn dịch sang tiếng Việt)\n这个问题问得好。油皮斑驳，百分之八十不是粉底的问题，是定妆的问题。你要分区定妆：T区出油多，散粉要压实一点，可以用粉扑按压，不要用刷子轻扫；脸颊干的地方少定一点，不然会卡粉。还有一个很多人忽略的——妆前那一步。油皮如果妆前保湿没做够，皮肤会拼命出油来补，反而更容易斑驳。所以油皮不是不要保湿，是要选清爽的保湿。","vi":"【Học viên hỏi → 中文】老师，我是油皮，但化完妆大概两个小时就会一块一块地斑驳，特别是T区。这是粉底的问题还是定妆的问题？\n\n【Cô trả lời → tiếng Việt】Câu hỏi hay đấy. Da dầu bị loang lổ thì tám mươi phần trăm không phải lỗi kem nền, mà là lỗi bước khoá nền. Em phải khoá nền theo từng vùng: vùng chữ T đổ dầu nhiều thì phấn phủ phải ấn cho chặt, dùng bông phấn ấn xuống chứ đừng lấy cọ quét nhẹ; chỗ má khô thì khoá ít thôi, không là bị đọng phấn. Còn một điều rất nhiều người bỏ qua — bước dưỡng trước khi makeup. Da dầu mà dưỡng ẩm không đủ thì da sẽ càng tiết dầu để bù lại, lại càng dễ loang. Cho nên da dầu không phải là không cần dưỡng ẩm, mà là phải chọn loại dưỡng ẩm thoáng nhẹ.","n":["Đây là bài HAI CHIỀU — luyện đúng tình huống khó nhất ở hiện trường: nghe tiếng Việt, bật ra tiếng Trung, rồi ngược lại.","Chiều Việt→Trung: “loang lổ từng mảng” → 一块一块地斑驳; “vùng chữ T” → T区; “bước khoá nền” → 定妆.","分区定妆 — “khoá nền theo từng vùng”. Khái niệm cốt lõi của đoạn.","压实 vs 轻扫 — “ấn cho chặt” vs “quét nhẹ”. Lại là một cặp đối lập về thao tác, phải dịch rõ.","卡粉 — “bị đọng phấn”. Không có từ một tiếng.","Câu cuối “不是…是…” giữ cấu trúc: “không phải là… mà là…”."]},{"t":"Makeup lên ảnh","c":"上镜妆","lv":"Khó","zh":"上镜妆和生活妆最大的区别是什么？是镜头会吃掉你脸上的立体感。你肉眼看着刚刚好的修容，拍出来就是平的；你觉得已经很红的腮红，照片里几乎看不见。所以上镜妆要整体加重一度——但注意，是加重，不是加厚。底妆反而要更薄更服帖，因为高清镜头会放大一切粉感和卡粉。重点加在哪？眉毛要清晰，眼线要实一点，唇色要饱和，修容的边界可以稍微明显一点。还有一个小技巧：拍照前用吸油纸把T区按一下，再补一点散粉，出片会干净很多。","vi":"Khác biệt lớn nhất giữa makeup lên ảnh và makeup đời thường là gì? Là ống kính sẽ nuốt mất độ nổi khối trên mặt. Khối em nhìn bằng mắt thấy vừa đẹp, chụp ra là phẳng lì; má hồng em thấy đã đỏ lắm rồi, trong ảnh gần như không thấy gì. Vì vậy makeup lên ảnh phải đánh đậm hơn một độ — nhưng chú ý, là ĐẬM hơn chứ không phải DÀY hơn. Lớp nền ngược lại còn phải mỏng hơn và bám da hơn, vì ống kính độ phân giải cao sẽ phóng to mọi cảm giác bột phấn và chỗ đọng phấn. Đậm thêm ở đâu? Chân mày phải sắc nét, kẻ mắt rõ hơn một chút, màu môi phải lên màu, đường tạo khối có thể để hiện rõ hơn một chút. Còn một mẹo nhỏ: trước khi chụp lấy giấy thấm dầu ấn vùng chữ T rồi dặm thêm chút phấn phủ, ảnh ra sẽ sạch hơn nhiều.","n":["吃掉立体感 — ẩn dụ: “ống kính nuốt mất độ nổi khối”. Giữ được hình ảnh “nuốt” là hay nhất.","加重 ≠ 加厚 — “đậm hơn” chứ không “dày hơn”. Đây là cả ý chính của đoạn; dịch lẫn hai chữ này là hỏng bài giảng.","实一点 — “rõ nét hơn”. 虚 là mờ, 实 là rõ.","饱和 — “lên màu / màu phải no”. Đừng dịch “bão hoà” nghe như hoá học.","出片 — khẩu ngữ nghề ảnh: “ảnh ra / lên ảnh”. Đừng dịch “xuất phim”."]}],"guide":[{"id":"modes","t":"Ba chế độ trong một buổi","open":1,"blocks":[["p","Lớp demo không chạy một nhịp duy nhất. Nhận ra mình đang ở chế độ nào là xong một nửa công việc."],["def","Bám sát · 跟随式",[["Xảy ra khi","Cô đang làm mẫu, tay đang chạm vào mặt mẫu"],["Cô nói bao lâu","1–2 câu"],["Bạn làm gì","Dịch ngay. Câu cực ngắn, bắt đầu bằng động từ, bỏ hết chủ ngữ thừa"],["Lỗi hay gặp","Dịch dài quá → học viên mất nhịp, không kịp nhìn tay cô"]]],["def","Theo đoạn · 交替传译",[["Xảy ra khi","Cô giảng lý thuyết: phân tích da, phân tích dáng mặt, giải thích vì sao"],["Cô nói bao lâu","30–60 giây"],["Bạn làm gì","Ghi chú. Chờ hết một ý trọn vẹn rồi dịch cả đoạn"],["Lỗi hay gặp","Cắt ngang giữa ý → logic đứt, học viên không hiểu tại sao"]]],["def","Hai chiều · 双向",[["Xảy ra khi","Học viên đang thực hành, hỏi đáp qua lại"],["Cô nói bao lâu","Ngắn, lộn xộn, chen nhau"],["Bạn làm gì","Dịch cả hai chiều. Luôn nói rõ ai đang nói: “Bạn này hỏi…”, “Cô trả lời…”"],["Lỗi hay gặp","Quên đánh dấu người nói → cả lớp rối, không biết ai nói câu nào"]]],["box","Quy tắc vàng của chế độ bám sát: dịch để LÀM ĐƯỢC, không dịch cho hay",["原文: 你把刷子上的粉抖一抖，不要直接上脸。","✗ Dịch “đẹp”: “Bạn hãy gõ nhẹ để loại bỏ phần phấn thừa còn bám trên cọ, tránh đưa trực tiếp lên bề mặt da.”","✓ Dịch “dùng được”: “Gõ bớt phấn trên cọ đi. Đừng đưa thẳng lên mặt.”","Học viên đang cầm cọ. Họ cần một mệnh lệnh làm được ngay. Câu càng ngắn, lớp càng theo kịp."],"mint"]]},{"id":"note","t":"Ghi chú — ghi ý, không ghi chữ","blocks":[["p","Bạn không kịp chép lại lời cô, và cũng không cần. Ghi chú chỉ để giữ bộ khung và những thứ trí nhớ hay đánh rơi."],["h","Bốn thứ BẮT BUỘC ghi"],["bul",["CON SỐ — số bước, tỉ lệ, phút chờ, giá, số màu. Ghi bằng chữ số, ghi ngay khi nghe.","TÊN RIÊNG — thương hiệu, tên sản phẩm, tên kỹ thuật. Nghe không rõ thì hỏi lại ngay, đừng để đến cuối đoạn.","PHỦ ĐỊNH — 不要 / 千万不要 / 别 / 不是…而是… Đánh dấu ∅ thật to. Sót một chữ “đừng” là bạn dạy ngược lại cả bước.","THỨ TỰ — 先…再…然后… Đánh số ① ② ③. Lớp thực hành sai thứ tự là hỏng cả lớp nền."]],["h","Bộ ký hiệu riêng cho lớp makeup"],["sym",[["底","lớp nền"],["↑","làm sáng · highlight · hất lên"],["眼 眉 唇","mắt · mày · môi"],["↓","vùng tối · đưa xuống"],["修","tạo khối"],["→","tán từ … ra …"],["干 油","da khô · da dầu"],["∅","KHÔNG — đừng — tránh"],["① ② ③","thứ tự các bước"],["✓","đúng · được phép"],["⊕ ⊖","thêm vào · bớt đi"],["△","lưu ý, cảnh báo"],["☺","cô khen"],["?","chỗ chưa chắc — hỏi lại"]]],["box","Mẹo chỉ dùng được trong lớp makeup: vẽ cái mặt",["Đầu mỗi trang nháp, vẽ nhanh một hình oval với hai mắt, mũi, miệng. Cô nói về vùng nào thì khoanh thẳng vào đó rồi viết ký hiệu bên cạnh.","Lý do: phần lớn nội dung lớp này là VỊ TRÍ trên mặt — 面中, 山根, 颧弓, 眼尾, 法令纹. Khoanh lên hình nhanh và chính xác hơn viết chữ, và khi dịch chỉ cần nhìn hình là nhớ ra cả đoạn."],"mint"]]},{"id":"field","t":"Tại hiện trường — những thứ không ai dạy","blocks":[["def2",[["Đứng ở đâu","Đứng chếch phía sau hoặc bên cạnh cô, KHÔNG đứng giữa cô và học viên. Khi cô làm mẫu, chọn chỗ bạn nhìn rõ tay cô — phải thấy cô đang làm gì mới dịch đúng được."],["Cô nói quá dài, bạn quên đoạn đầu","Giơ tay (ám hiệu đã chốt trước). Nếu lỡ rồi: dịch phần bạn nhớ chắc, rồi nói 「老师，前面那段我再确认一下」. Đừng bịa cho đủ."],["Bạn phát hiện mình vừa dịch sai","Sửa ngay, nhẹ nhàng: “Em xin đính chính một chút ạ — ý cô là…”. Sửa ngay thì không ai đánh giá; để đến cuối buổi mới sửa mới là vấn đề."],["Học viên nói chen vào khi cô đang giảng","Ra hiệu chờ, dịch xong ý của cô rồi mới chuyển câu hỏi: “Có bạn vừa hỏi là…”. Đừng cắt ngang mạch của cô."],["Hai, ba người hỏi cùng lúc","Chỉ tay chọn một người: “Bạn hỏi trước ạ, rồi đến bạn.” Bạn có quyền điều phối — đó là một phần việc của người dịch."],["Giọng","Thứ hỏng trước tiên. Uống nước ấm liên tục từng ngụm nhỏ; KHÔNG hắng giọng (hại dây thanh); nói bằng hơi bụng chứ đừng gắng ở cổ. Nước ấm, không đá."],["Sức","Lớp demo đứng gần như cả ngày. Giày bệt. Giờ nghỉ thì ngồi và im lặng — đừng nói chuyện xã giao, đó là lúc giọng bạn hồi."],["Điện thoại","Chụp vỏ hộp sản phẩm, chụp bảng trắng. Trưa và cuối ngày rà lại với cô một lượt các từ mới."]]],["box","Bảy lỗi kinh điển của người dịch lần đầu",["1. Cố dịch đủ từng chữ. Lớp thực hành cần ĐÚNG Ý và ĐÚNG NHỊP, không cần đủ chữ.","2. Không dám ngắt lời giảng viên. Cô không biết bạn đã quá tải nếu bạn không ra hiệu.","3. Ngại hỏi lại nên đoán bừa. Một từ đoán sai trong lớp dạy nghề sẽ được chép vào vở và mang đi dùng.","4. Dịch văn vẻ. Câu lệnh phải cộc, ngắn, làm được ngay.","5. Tự thêm ý kiến của mình. Bạn quen đứng lớp nên rất dễ buột miệng giải thích thêm — muốn bổ sung thì xin phép cô trước.","6. Quên uống nước. Đến 3 giờ chiều mất giọng là hỏng nửa buổi.","7. Đứng chắn tầm nhìn. Học viên đến để NHÌN tay cô, không phải để nhìn bạn."],"warn"]]},{"id":"plan","t":"Kế hoạch luyện tập — 4 tuần, mỗi ngày 45 phút","blocks":[["p","Tính từ 11/11. Quỹ thời gian eo hẹp thì cắt bớt thời lượng, đừng bỏ tuần — bốn tuần này xây lên nhau."],["def","TUẦN 1 · 11–17/11",[["Mục tiêu","Nạp từ. Nghe tiếng Trung chuyên ngành không còn lạ tai."],["Mỗi ngày","25 phút: học 30 từ ở tab Thẻ nhớ, kiểm hai chiều. 20 phút: xem 1 video makeup tiếng Trung, không dịch, chỉ gạch ra những từ đã học vừa nghe thấy."],["Tự chấm","Cuối tuần: mở tab 20 từ bẫy, bật ra tiếng Việt dưới 2 giây mỗi từ."]]],["def","TUẦN 2 · 18–24/11",[["Mục tiêu","Shadowing. Mồm theo kịp tai — nền tảng của mọi kỹ năng dịch nói."],["Mỗi ngày","30 phút shadowing (cách làm ở mục dưới). 15 phút ôn từ tuần 1 + thêm 15 từ mới."],["Tự chấm","Ghi âm 1 phút shadowing. Nghe lại: có tụt lại quá nửa câu không? Có nuốt chữ không?"]]],["def","TUẦN 3 · 25/11–01/12",[["Mục tiêu","Dịch đuổi có ghi chú. Bắt đầu thật sự dịch."],["Mỗi ngày","30 phút: tab Luyện dịch → Câu ngắn, dịch ra miệng và GHI ÂM. 15 phút: nghe lại bản ghi của chính mình, ghi ra chỗ vấp."],["Tự chấm","Mỗi ngày đếm số chỗ vấp. Cuối tuần phải thấy con số giảm rõ."]]],["def","TUẦN 4 · 02–08/12",[["Mục tiêu","Mô phỏng thực chiến. Quen áp lực và quen đứng."],["Mỗi ngày","45 phút: tab Luyện dịch → Đoạn dài, ĐỨNG mà dịch, bấm giờ, không dừng, không tra từ. Làm 3 lần trong tuần. Hai ngày còn lại luyện riêng chiều Việt→Trung."],["Tự chấm","Dịch hết một đoạn không dừng. Vấp thì vấp, nhưng không được dừng — đúng như hiện trường."]]]]},{"id":"how","t":"Shadowing & chiều Việt → Trung","blocks":[["h","Shadowing làm thế nào cho đúng"],["bul",["Chọn video makeup tiếng Trung có người nói liên tục (video của 姜乘澜 rất hợp: nói rõ, tốc độ vừa, đúng chuyên ngành).","Bật video, KHÔNG dịch. Nghe và nói đuổi theo bằng TIẾNG TRUNG, chậm hơn cô khoảng 2–3 chữ. Như một cái bóng.","Mục tiêu không phải hiểu — mục tiêu là mồm chạy kịp tai trong khi não vẫn đang xử lý. Đây chính là cơ chế bạn cần ở hiện trường.","Tuần đầu bị tụt lại là bình thường. Đừng tua lại, cứ bắt nhịp vào câu kế tiếp — hiện trường cũng vậy, mất một câu thì bỏ, đừng đuổi theo.","Khi đã theo kịp dễ dàng, nâng cấp: shadowing bằng tiếng Trung nhưng tay ghi chú bằng ký hiệu. Lúc đó bạn đang luyện đúng thứ sẽ dùng thật."]],["h","Chiều Việt → Trung — đừng bỏ qua"],["p","Chiều này khó hơn và người mới hay quên, nhưng ở hiện trường nó chiếm tới một phần ba thời lượng: học viên hỏi, bạn phải bật ra tiếng Trung ngay."],["bul",["Vào tab Luyện dịch → Câu ngắn → đổi sang Việt → 中文, chọn nhóm “Học viên hỏi”. Tập đến mức bật ra không cần nghĩ.","Tự nghĩ thêm 15 câu hỏi mà một MUA Việt Nam sẽ hỏi (về da, về sản phẩm, về khách hàng Việt), dịch sẵn sang tiếng Trung.","Tập NÓI TO, không tập trong đầu. Nghĩ ra được không có nghĩa là nói ra được."]]]},{"id":"day","t":"Checklist ngày dạy","blocks":[["p","Tick được — tự lưu trong máy. Sáng hôm đó mở ra chạy một lượt."],["h","Mang theo"],["chk","ck_bring",["Sổ thuật ngữ + sổ mẫu câu (bản in)","Sổ nhỏ + 2 cây bút để ghi chú đứng","Nước ấm, không đá — ít nhất 1 lít","Kẹo ngậm thông họng","Điện thoại sạc đầy để chụp vỏ sản phẩm","Giày bệt"]],["h","Đến sớm 30 phút — làm đủ 5 việc"],["chk","ck_early",["Rà quy trình buổi học với cô một lượt","Xem và chụp toàn bộ sản phẩm cô sẽ dùng","Chốt ám hiệu “xin dừng” và độ dài mỗi lượt nói","Thử chỗ đứng: nhìn rõ tay cô, không chắn tầm nhìn học viên","Thử giọng trong phòng — phòng rộng thì phải nói to hơn bạn tưởng"]],["h","Trong buổi — tự nhắc"],["chk","ck_during",["Câu lệnh thì NGẮN. Lý thuyết thì ĐỦ Ý.","Nghe thấy 不要 / 别 — dịch chữ “đừng” cho thật rõ","Số và tên thương hiệu: ghi ngay, không nhớ bằng đầu","Bí từ: nhìn tay cô → giữ tiếng Anh → mô tả → hỏi cô → hỏi học viên. Không bịa.","Uống nước mỗi 20 phút. Không hắng giọng.","Từ mới nghe được: ghi vào lề sổ thuật ngữ ngay lúc đó"]],["box","Cuối ngày — 15 phút đáng giá nhất",["Ngồi lại với cô, rà qua những từ bạn đã đánh dấu “?”. Hỏi luôn ngày mai cô định dạy gì để tối về chuẩn bị từ.","Hỏi một, hai học viên: “Hôm nay có chỗ nào em dịch mà mọi người thấy khó hiểu không ạ?” Câu trả lời của họ đáng giá hơn mọi tài liệu.","Bổ sung từ mới vào sổ ngay tối đó. Ngày thứ hai bạn sẽ thấy nhẹ hơn hẳn — đến ngày thứ ba thì gần như không còn vất vả nữa."],"mint"]]}]};
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.innerHTML = h; return e; };
const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase();
const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
D.terms.forEach(t => { t._s = norm(t.zh + ' ' + t.py + ' ' + t.vi + ' ' + t.note); });
D.phrases.forEach(p => { p._s = norm(p.zh + ' ' + p.vi + ' ' + p.note); });
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

/* ---------- tabs ---------- */
const views = ['look', 'flash', 'quiz', 'prac', 'phr', 'skill', 'top'];
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b));
  views.forEach(v => $('#' + v).classList.toggle('hide', v !== b.dataset.v));
  window.scrollTo(0, 0);
  if (b.dataset.v === 'flash') drawFlash();
  if (b.dataset.v === 'quiz') nextQ();
  if (b.dataset.v !== 'prac') stopTimer();
  try { location.hash = b.dataset.v; } catch (e) {}
});

/* ---------- lookup ---------- */
let cat = 'Tất cả', onlyW = false;
const chips = $('#chips');
['Tất cả'].concat(D.cats).forEach(c => {
  const b = el('button', 'chip' + (c === 'Tất cả' ? ' on' : ''), esc(c));
  b.onclick = () => { cat = c; [...chips.children].forEach(x => x.classList.toggle('on', x === b || (x.classList.contains('warn') && onlyW))); draw(); };
  chips.appendChild(b);
});
const wb = el('button', 'chip warn', 'Chỉ từ bẫy');
wb.onclick = () => { onlyW = !onlyW; wb.classList.toggle('on', onlyW); draw(); };
chips.appendChild(wb);

function hl(txt, q) {
  if (!q) return esc(txt);
  const n = norm(txt), nq = norm(q), i = n.indexOf(nq);
  if (i < 0) return esc(txt);
  return esc(txt.slice(0, i)) + '<mark>' + esc(txt.slice(i, i + q.length)) + '</mark>' + esc(txt.slice(i + q.length));
}
function termCard(t, q) {
  const c = el('div', 'card' + (t.w ? ' w' : ''));
  const r = el('div', 'row1');
  r.appendChild(el('div', 't-zh zh', hl(t.zh, q)));
  if (t.py) r.appendChild(el('div', 't-py', esc(t.py)));
  c.appendChild(r);
  c.appendChild(el('div', 't-vi', hl(t.vi, q)));
  if (t.note) c.appendChild(el('div', 't-note', (t.w ? '⚠ ' : '') + hl(t.note, q)));
  c.appendChild(el('span', 't-cat', esc(t.c) + ' · ' + esc(t.cz)));
  return c;
}
function draw() {
  const q = $('#q').value.trim(), nq = norm(q);
  $('#cx').style.display = q ? 'block' : 'none';
  const list = D.terms.filter(t => (cat === 'Tất cả' || t.c === cat) && (!onlyW || t.w) && (!nq || t._s.includes(nq)));
  $('#count').textContent = list.length + ' từ';
  const box = $('#res'); box.innerHTML = '';
  if (!list.length) { box.appendChild(el('div', 'empty', 'Không tìm thấy từ này.<br>Thử gõ bằng tiếng Trung, pinyin không dấu,<br>hoặc tiếng Việt không dấu.')); return; }
  const f = document.createDocumentFragment();
  list.slice(0, 400).forEach(t => f.appendChild(termCard(t, q)));
  box.appendChild(f);
}
$('#q').oninput = draw;
$('#cx').onclick = () => { $('#q').value = ''; draw(); $('#q').focus(); };
draw();

/* ---------- flashcards ---------- */
let fdir = 'zh', fcat = 'Tất cả', fdeck = [], fi = 0, fshow = false;
const fcatBox = $('#fcat');
['Tất cả', 'Từ bẫy'].concat(D.cats).forEach(c => {
  const b = el('button', 'chip' + (c === 'Tất cả' ? ' on' : ''), esc(c));
  b.onclick = () => { fcat = c; [...fcatBox.children].forEach(x => x.classList.toggle('on', x === b)); buildDeck(); };
  fcatBox.appendChild(b);
});
$('#dir').querySelectorAll('button').forEach(b => b.onclick = () => {
  fdir = b.dataset.d; $('#dir').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); drawFlash();
});
function known() { return store('mk_known') || {}; }
function fpool() { return D.terms.filter(t => fcat === 'Tất cả' || (fcat === 'Từ bẫy' ? t.w : t.c === fcat)); }
function buildDeck() {
  const k = known(), pool = fpool();
  const left = pool.filter(t => !k[t.i]);
  fdeck = (left.length ? left : pool).slice().sort(() => Math.random() - .5);
  fi = 0; fshow = false; drawFlash();
}
function drawFlash() {
  if (!fdeck.length) { buildDeck(); return; }
  const k = known(), pool = fpool(), done = pool.filter(t => k[t.i]).length;
  $('#fmeta').textContent = 'Thuộc ' + done + '/' + pool.length + ' · còn ' + Math.max(0, fdeck.length - fi) + ' thẻ';
  $('#fprog').style.width = (pool.length ? done / pool.length * 100 : 0) + '%';
  const c = $('#fcard'); c.innerHTML = '';
  if (fi >= fdeck.length) {
    c.appendChild(el('div', 'front small', 'Xong vòng này'));
    c.appendChild(el('div', 'hint', 'Bấm để bắt đầu vòng mới'));
    c.onclick = buildDeck; return;
  }
  const t = fdeck[fi], frontTxt = fdir === 'zh' ? t.zh : t.vi;
  c.appendChild(el('div', 'front' + (frontTxt.length > 8 ? ' small' : '') + (fdir === 'zh' ? ' zh' : ''), esc(frontTxt)));
  if (fshow) {
    const b = el('div', 'back');
    b.appendChild(el('div', 'v' + (fdir === 'vi' ? ' zh' : ''), esc(fdir === 'zh' ? t.vi : t.zh) + (fdir === 'vi' && t.py ? ' <span style="font-size:13px;color:#5E4B14;font-style:italic;font-family:\'DM Sans\',sans-serif">' + esc(t.py) + '</span>' : '')));
    if (t.note) b.appendChild(el('div', 'n', (t.w ? '⚠ ' : '') + esc(t.note)));
    c.appendChild(b);
  } else {
    c.appendChild(el('div', 'hint', 'Bấm vào thẻ để xem đáp án'));
  }
  c.onclick = () => { fshow = !fshow; drawFlash(); };
}
$('#fyes').onclick = () => { const t = fdeck[fi]; if (!t) return; const k = known(); k[t.i] = 1; store('mk_known', k); fi++; fshow = false; drawFlash(); };
$('#fno').onclick = () => { const t = fdeck[fi]; if (!t) return; const k = known(); delete k[t.i]; store('mk_known', k); fdeck.push(t); fi++; fshow = false; drawFlash(); };
$('#freset').onclick = () => { store('mk_known', {}); buildDeck(); };
buildDeck();

/* ---------- quiz ---------- */
let qmode = 'all', qcur = null, qn = 0, qok = 0;
$('#qmode').querySelectorAll('button').forEach(b => b.onclick = () => {
  qmode = b.dataset.m; $('#qmode').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  qn = 0; qok = 0; nextQ();
});
function qpool() { return qmode === 'warn' ? D.terms.filter(t => t.w) : D.terms; }
function nextQ() {
  if (qn >= 12) { showScore(); return; }
  const p = qpool(), t = p[Math.floor(Math.random() * p.length)];
  let same = D.terms.filter(x => x.c === t.c && x.i !== t.i && x.vi !== t.vi);
  if (same.length < 3) same = D.terms.filter(x => x.i !== t.i && x.vi !== t.vi);
  const wrong = same.sort(() => Math.random() - .5).slice(0, 3);
  qcur = { t, opts: [t].concat(wrong).sort(() => Math.random() - .5) };
  const box = $('#qbody'); box.innerHTML = '';
  box.appendChild(el('div', 'meta', '<span>Câu ' + (qn + 1) + '/12</span><span>Đúng ' + qok + '</span>'));
  box.appendChild(el('div', 'q' + (t.zh.length > 6 ? ' small' : '') + ' zh', esc(t.zh)));
  box.appendChild(el('div', 'qsub', esc(t.py || '') + ' · nghĩa tiếng Việt trong nghề là gì?'));
  const o = el('div', 'opts');
  qcur.opts.forEach(x => { const b = el('button', 'opt', esc(x.vi)); b.onclick = () => answer(b, x, o); o.appendChild(b); });
  box.appendChild(o);
}
function answer(btn, pick, box) {
  const t = qcur.t;
  [...box.children].forEach(b => { b.disabled = true; });
  if (pick.i === t.i) { qok++; btn.classList.add('right'); }
  else { btn.classList.add('wrong'); [...box.children].forEach(b => { if (b.textContent === t.vi) b.classList.add('right'); }); }
  qn++;
  $('#qbody').appendChild(el('div', 'exp', '<b class="zh" style="font-size:17px">' + esc(t.zh) + '</b> → <b style="color:var(--purple-deep)">' + esc(t.vi) + '</b>' + (t.note ? '<br>' + (t.w ? '⚠ ' : '') + esc(t.note) : '')));
  const nb = el('button', 'nextb', qn >= 12 ? 'Xem kết quả' : 'Câu tiếp →');
  nb.onclick = nextQ;
  $('#qbody').appendChild(nb);
  nb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function showScore() {
  const box = $('#qbody'); box.innerHTML = '';
  const s = el('div', 'score');
  s.appendChild(el('div', 'big', qok + '/12'));
  s.appendChild(el('div', 'msg', qok >= 10 ? 'Chắc rồi — chuyển sang nhóm khác.' : qok >= 7 ? 'Ổn. Làm thêm một lượt nữa.' : 'Quay lại phần Thẻ nhớ trước đã.'));
  box.appendChild(s);
  const nb = el('button', 'nextb', 'Làm lại'); nb.onclick = () => { qn = 0; qok = 0; nextQ(); };
  box.appendChild(nb);
}

/* ---------- luyện dịch: câu ngắn ---------- */
const drillable = p => p.zh && p.vi && p.g.indexOf('Trước giờ học') < 0;
const DGRP = [...new Set(D.phrases.filter(drillable).map(p => p.g))];
let sdir = 'zh', sgrp = 'Tất cả', spool = [], si = 0, sshow = false;
const sgrpBox = $('#sgrp');
['Tất cả'].concat(DGRP).forEach(g => {
  const b = el('button', 'chip' + (g === 'Tất cả' ? ' on' : ''), esc(g));
  b.onclick = () => { sgrp = g; [...sgrpBox.children].forEach(x => x.classList.toggle('on', x === b)); buildDrill(); };
  sgrpBox.appendChild(b);
});
$('#sdir').querySelectorAll('button').forEach(b => b.onclick = () => {
  sdir = b.dataset.d; $('#sdir').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); buildDrill();
});
function buildDrill() {
  spool = D.phrases.filter(p => drillable(p) && (sgrp === 'Tất cả' || p.g === sgrp)).sort(() => Math.random() - .5);
  si = 0; sshow = false; drawDrill();
}
function drawDrill() {
  if (!spool.length) { buildDrill(); return; }
  if (si >= spool.length) { si = 0; spool.sort(() => Math.random() - .5); }
  const p = spool[si];
  $('#smeta').textContent = 'Câu ' + (si + 1) + '/' + spool.length + ' · ' + p.g;
  const c = $('#scard'); c.innerHTML = '';
  c.appendChild(el('div', 'src ' + (sdir === 'zh' ? 'zh' : 'lat'), esc(sdir === 'zh' ? p.zh : p.vi)));
  if (sshow) {
    const a = el('div', 'ans');
    a.appendChild(el('div', 'a' + (sdir === 'vi' ? ' zh' : ''), esc(sdir === 'zh' ? p.vi : p.zh)));
    if (p.note) a.appendChild(el('div', 'nn', esc(p.note)));
    c.appendChild(a);
  } else {
    c.appendChild(el('div', 'tapme', 'Dịch ra miệng trước — rồi bấm vào thẻ để xem đáp án'));
  }
  c.onclick = () => { sshow = !sshow; drawDrill(); };
}
$('#snext').onclick = () => { si++; sshow = false; drawDrill(); };
buildDrill();

/* ---------- luyện dịch: đoạn dài ---------- */
let ptimer = null;
function stopTimer() { if (ptimer) { clearInterval(ptimer); ptimer = null; } }
$('#pmode').querySelectorAll('button').forEach(b => b.onclick = () => {
  const m = b.dataset.p;
  $('#pmode').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  $('#sentbox').classList.toggle('hide', m !== 'sent');

  if (m === 'para') showList(); else stopTimer();

function showList() {
  stopTimer();

  D.passages.forEach((p, i) => {
    const b = el('button', 'pass');

    d.appendChild(el('div', 'tt', esc(p.t)));

function openPass(i) {
  const p = D.passages[i];
  $('#plist').classList.add('hide');
  const d = $('#pdetail'); d.classList.remove('hide'); d.innerHTML = '';
  const top = el('div', 'ptop');

  const tm = el('div', 'timer', '0:00'); top.appendChild(tm);
  d.appendChild(top);

    const nb = el('button', 'nextb', i < D.passages.length - 1 ? 'Đoạn tiếp →' : 'Về danh sách');
    nb.onclick = () => { if (i < D.passages.length - 1) openPass(i + 1); else showList(); };

  };
}

/* ---------- phrases ---------- */
let pg = 'Tất cả';
const pchips = $('#pchips');
['Tất cả'].concat([...new Set(D.phrases.map(p => p.g))]).forEach(g => {
  const b = el('button', 'chip' + (g === 'Tất cả' ? ' on' : ''), esc(g));
  b.onclick = () => { pg = g; [...pchips.children].forEach(x => x.classList.toggle('on', x === b)); drawP(); };
  pchips.appendChild(b);
});
function drawP() {
  const q = $('#pq').value.trim(), nq = norm(q);
  $('#pcx').style.display = q ? 'block' : 'none';
  const list = D.phrases.filter(p => (pg === 'Tất cả' || p.g === pg) && (!nq || p._s.includes(nq)));
  const box = $('#pres'); box.innerHTML = '';
  if (!list.length) { box.appendChild(el('div', 'empty', 'Không có mẫu câu khớp.')); return; }
  let cur = ''; const f = document.createDocumentFragment();
  list.forEach(p => {
    if (p.g !== cur) { cur = p.g; f.appendChild(el('div', 'sect', esc(cur))); }
    const c = el('div', 'p-card' + (p.rev ? ' p-rev' : ''));
    if (p.rev) {
      c.appendChild(el('div', 'p-vi', hl(p.vi, q)));
      c.appendChild(el('div', 'p-zh zh', hl(p.zh, q)));
    } else {
      if (p.zh) c.appendChild(el('div', 'p-zh zh', hl(p.zh, q)));
      if (p.vi) c.appendChild(el('div', 'p-vi', hl(p.vi, q)));
    }
    if (p.note) c.appendChild(el('div', 'p-note', esc(p.note)));
    f.appendChild(c);
  });
  box.appendChild(f);
}
$('#pq').oninput = drawP;
$('#pcx').onclick = () => { $('#pq').value = ''; drawP(); $('#pq').focus(); };
drawP();

/* ---------- cẩm nang kỹ năng ---------- */
(function () {
  const box = $('#gres');
  D.guide.forEach((sec, si) => {
    const a = el('div', 'acc' + (sec.open ? ' open' : ''));
    const h = el('button', 'acc-h');
    h.appendChild(el('div', 'no', String(si + 1)));
    h.appendChild(el('div', null, esc(sec.t)));
    h.appendChild(el('div', 'ar', '▾'));
    h.onclick = () => a.classList.toggle('open');
    a.appendChild(h);
    const b = el('div', 'acc-b');
    sec.blocks.forEach(bl => {
      const k = bl[0];
      if (k === 'p') b.appendChild(el('p', null, esc(bl[1])));
      else if (k === 'h') b.appendChild(el('h4', null, esc(bl[1])));
      else if (k === 'bul') {
        const ul = el('ul', null, '');
        bl[1].forEach(x => ul.appendChild(el('li', null, esc(x))));
        b.appendChild(ul);
      } else if (k === 'def') {
        const d = el('div', 'dcard');
        d.appendChild(el('div', 'dt', esc(bl[1])));
        bl[2].forEach(pair => {
          const r = el('div', 'drow');
          r.appendChild(el('div', 'dk', esc(pair[0])));
          r.appendChild(el('div', 'dv', esc(pair[1])));
          d.appendChild(r);
        });
        b.appendChild(d);
      } else if (k === 'def2') {
        bl[1].forEach(pair => {
          const d = el('div', 'd2');
          d.appendChild(el('div', 'dt', esc(pair[0])));
          d.appendChild(el('div', 'dd', esc(pair[1])));
          b.appendChild(d);
        });
      } else if (k === 'sym') {
        const g = el('div', 'symg');
        bl[1].forEach(pair => g.appendChild(el('div', null, '<b>' + esc(pair[0]) + '</b>' + esc(pair[1]))));
        b.appendChild(g);
      } else if (k === 'box') {
        const g = el('div', 'gbox ' + (bl[3] || 'mint'));
        g.appendChild(el('div', 'gt', esc(bl[1])));
        bl[2].forEach(l => g.appendChild(el('div', 'gl', esc(l))));
        b.appendChild(g);
      } else if (k === 'chk') {
        const key = bl[1];
        bl[2].forEach((item, ii) => {
          const saved = store(key) || {};
          const r = el('div', 'chkrow' + (saved[ii] ? ' done' : ''));
          const bx = el('div', 'bx', saved[ii] ? '✓' : '');
          r.appendChild(bx);
          r.appendChild(el('div', null, esc(item)));
          r.onclick = () => {
            const s = store(key) || {};
            if (s[ii]) delete s[ii]; else s[ii] = 1;
            store(key, s);
            r.classList.toggle('done', !!s[ii]);
            bx.textContent = s[ii] ? '✓' : '';
          };
          b.appendChild(r);
        });
      }
    });
    a.appendChild(b);
    box.appendChild(a);
  });
})();

/* ---------- top 20 ---------- */

  const box = $('#topres');
  D.top20.forEach(t => {
    const c = el('div', 'card w');
    c.appendChild(el('div', 't-zh zh', esc(t.zh)));
    c.appendChild(el('div', 't-vi', esc(t.vi)));

/* ---------- hash ---------- */
(function () {
  const h = (location.hash || '').replace('#', '');
  if (views.includes(h)) { const b = document.querySelector('.tab[data-v="' + h + '"]'); if (b) b.click(); }
})();
